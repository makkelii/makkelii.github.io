<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suomen 585 Oy – Tukkutilaus</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: #fff;
    }
    header {
      background: #4b0082; /* Royal purple */
      color: #FFD700;      /* Gold */
      padding: 10px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
    }
    .container {
      display: flex;
      padding: 10px;
      gap: 20px;
    }
    .products {
      flex: 3;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      max-width: 100%;
      border-radius: 6px;
      cursor: pointer;
    }
    .card h4 {
      margin: 8px 0 4px;
      font-size: 14px;
      text-align: center;
    }
    .addrow {
      margin-top: auto;
      display: grid;
      grid-template-columns: 45px 45px 1fr; /* kavennettu koko-kenttä */
      gap: 5px;
      width: 100%;
    }
    .addrow select, 
    .addrow input {
      width: 100%;
      padding: 5px;
      border-radius: 4px;
      border: none;
      font-size: 13px;
    }
    .addrow button {
      background: #FFD700;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      padding: 5px;
    }
    .cart {
      flex: 1;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cart h2 {
      margin: 0;
    }
    .cart table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .cart th, .cart td {
      text-align: left;
      padding: 4px;
    }
    .cart button {
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .send { background: #FFD700; }
    .clear { background: #ff4d4d; color: white; }
    .copy  { background: #444; color: white; }
  </style>
</head>
<body>
  <header>B2B – Tukkutilaus</header>
  <div class="container">
    <!-- Tuotelista -->
    <div class="products" id="productList">
      <div class="card">
        <img src="images/Kaulaketjut/tuote1.jpg" alt="Tuote 1">
        <h4>C.S.R.S 50</h4>
        <p>C.S.R.S-50</p>
        <div class="addrow">
          <select><option>Koko</option></select>
          <input type="number" value="1" min="1">
          <button>Lisää koriin</button>
        </div>
      </div>
      <div class="card">
        <img src="images/Kaulaketjut/tuote2.jpg" alt="Tuote 2">
        <h4>C.S.R.S 60</h4>
        <p>C.S.R.S-60</p>
        <div class="addrow">
          <select><option>Koko</option></select>
          <input type="number" value="1" min="1">
          <button>Lisää koriin</button>
        </div>
      </div>
    </div>

    <!-- Ostoskori -->
    <div class="cart">
      <h2>Ostoskori</h2>
      <table id="cartTable">
        <thead>
          <tr><th>Tuote / SKU</th><th>Koko</th><th>Kpl</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <textarea id="extraInfo" rows="3" placeholder="Lisätiedot (esim. viite, toimitus):"></textarea>
      <button class="copy">Kopioi tilaus</button>
      <button class="clear">Tyhjennä kori</button>
      <button class="send">Lähetä sähköpostilla</button>
    </div>
  </div>

  <script>
    const cartTable = document.querySelector("#cartTable tbody");
    document.querySelectorAll(".addrow button").forEach(btn => {
      btn.addEventListener("click", e => {
        const row = e.target.closest(".addrow");
        const card = e.target.closest(".card");
        const product = card.querySelector("h4").innerText;
        const size = row.querySelector("select").value;
        const qty = row.querySelector("input").value;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${product}</td><td>${size}</td><td>${qty}</td>`;
        cartTable.appendChild(tr);
      });
    });
  </script>
</body>
</html>
