<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suomen 585 Oy</title>

<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#222">

<style>
:root{
  --gold:#d4af37;
  --bg:#0f0f14;
  --ink:#e9e9f0;
  --muted:#bfc0d2;
  --card:#141421;
  --border:#2b2b3a;
}

*{ box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:url("images/bg-main.jpg") no-repeat center center fixed;
  background-size:cover;
  color:var(--ink);
}

/* --- Kirjautumisportti --- */
.gate{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.6); /* läpinäkyvä overlay kuvan päällä */
  display:flex; align-items:center; justify-content:center;
  z-index:10000;
}
.gate-card{
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:1.2rem;
  width:min(92vw,400px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.gate-card h2{ margin:.2rem 0 .8rem; text-align:center; }
.gate-card input{ width:100%; padding:.7rem .9rem; border:1px solid var(--border);
  border-radius:10px; margin-bottom:.6rem; background:transparent; color:var(--ink); font-size:16px; }
.gate-card button{ width:100%; padding:.85rem; border:none; border-radius:10px;
  background:var(--gold); color:#2d2050; font-weight:800; cursor:pointer; font-size:16px; }
.gate-err{ color:#ffb5b5; background:#2b0000; border:1px solid #7a0000;
  border-radius:8px; padding:.5rem .7rem; font-size:.9rem; margin-top:.5rem; display:none; text-align:center; }

/* --- Header --- */
header{ background:rgba(20,20,33,.8); color:var(--gold); padding:1rem; text-align:center; }
header h1{ margin:0; font-size:clamp(1.1rem,3.5vw,1.8rem); }

/* --- Layout --- */
.wrap{ max-width:1240px; margin:0 auto; padding:1rem;
  display:grid; grid-template-columns:1fr 400px; gap:1.2rem; }
@media (max-width:980px){ .wrap{ grid-template-columns:1fr; } }

/* --- Toolbar --- */
.toolbar{ display:flex; flex-wrap:wrap; gap:.6rem; margin:.6rem 0 1rem; }
.search{ flex:1; min-width:260px; display:flex; gap:.4rem; }
.search input{ flex:1; padding:.6rem .8rem; border:1px solid var(--border);
  border-radius:10px; background:rgba(0,0,0,.2); color:var(--ink); }
.search button{ border:1px solid var(--border); background:var(--card);
  border-radius:10px; padding:.6rem .8rem; cursor:pointer; color:var(--ink); }
.cats{ display:flex; gap:.5rem; margin:.25rem 0 .9rem; overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.cats::-webkit-scrollbar{ display:none; }
.cat-btn{ border:1px solid var(--border); background:var(--card);
  padding:.55rem .9rem; border-radius:999px; cursor:pointer; font-weight:600;
  color:var(--ink); white-space:nowrap; }
.cat-btn.active{ background:var(--gold); border-color:var(--gold); color:#2d2050; }

/* --- Gallery --- */
.gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
@media (max-width:540px){ .gallery{ grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); } }
figure{
  display:flex; flex-direction:column; gap:.55rem;
  background:rgba(20,20,33,.85); border:1px solid var(--border); border-radius:14px;
  padding:.65rem; margin:0; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.img-wrap{ width:100%; border-radius:10px; overflow:hidden; }
.img-wrap img{ width:100%; height:auto; display:block; object-fit:contain; cursor:zoom-in; }
figcaption{ font-size:.95rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sku{ font-size:.8rem; color:var(--muted); }

/* --- Add to cart row --- */
.addrow{ margin-top:auto; display:grid; gap:.42rem; grid-template-columns: 45px 45px 1fr; align-items:center; }
.addrow input{ padding:.42rem .45rem; border:1px solid var(--border); border-radius:9px;
  background:rgba(0,0,0,.2); color:var(--ink); min-width:0; font-size:.9rem; }
.addrow .size{ text-align:center; font-size:.92rem; }
.addrow .qty{ text-align:center; font-size:.92rem; }
.addrow button{ border:none; border-radius:9px; background:var(--gold); color:#2d2050;
  font-weight:800; cursor:pointer; padding:.46rem .5rem; font-size:.9rem; }
@media (max-width:560px){
  .addrow{ grid-template-columns:1fr 1fr; grid-template-areas:"size size" "qty add"; }
  .addrow .size{ grid-area:size; }
  .addrow .qty{ grid-area:qty; }
  .addrow button{ grid-area:add; }
}

/* --- Ostoskori aside --- */
#cartPanel{ background:rgba(20,20,33,.9); border:1px solid var(--border); border-radius:14px;
  padding:1rem; box-shadow:0 2px 10px rgba(0,0,0,.2); height:max-content; position:sticky; top:1rem; }
.cart-top{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin-bottom:.4rem; }
.cart-title{ font-weight:800; }
.btn{ border:1px solid var(--border); padding:.6rem .9rem; border-radius:10px; cursor:pointer;
  font-weight:700; background:var(--card); color:var(--ink); }
.btn.primary{ background:var(--gold); border-color:var(--gold); color:#2d2050; }
.btn.danger{ background:#ffe8e8; color:#800; border-color:#ffd0d0; }
.btn.outline{ background:transparent; color:var(--gold); border-color:var(--gold); }

/* --- Lightbox --- */
.lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:9999; }
.lightbox.show{ display:flex; }
.lightbox img{ max-width:95vw; max-height:92vh; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.6); }
.lightbox .close{ position:absolute; top:10px; right:12px; background:#fff; border:none; border-radius:8px; padding:.4rem .6rem; cursor:pointer; font-weight:700; }

</style>
</head>
<body>

<!-- Kirjautumisportti -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h2>B2B-portaali</h2>
    <input id="nameInput" type="text" placeholder="Nimi / yritys" autocomplete="name" />
    <input id="passInput" type="password" placeholder="Salasana" autocomplete="current-password" />
    <button id="passBtn" type="button">Avaa</button>
    <div class="gate-err" id="gateErr">Väärä salasana. Yritä uudelleen.</div>
  </div>
</div>

<header><h1>Suomen 585 Oy</h1></header>

<main class="wrap" aria-hidden="true" id="app">
  <section>
    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" placeholder="Hae SKU:lla…" />
        <button id="clear" type="button">Tyhjennä</button>
      </div>
      <div class="cats" id="cats"></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <aside id="cartPanel">
    <div class="cart-top">
      <div class="cart-title">Ostoskori</div>
      <button class="btn outline" id="logout" type="button">Kirjaudu ulos</button>
    </div>
    <div class="cart-items" id="cart"></div>
    <textarea id="note" class="note" placeholder="Lisätiedot…"></textarea>
    <div class="cart-actions">
      <button class="btn" id="copyOrder" type="button">Kopioi</button>
      <button class="btn danger" id="cartClear" type="button">Tyhjennä</button>
      <button class="btn primary" id="cartEmail" type="button">Lähetä</button>
    </div>
  </aside>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close" id="closeLb" type="button">Sulje</button>
  <img id="lightImg" alt="">
</div>
