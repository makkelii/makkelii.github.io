  html,body{ height:100% }
  body{

    color:#f3f4f6;
  }

    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.75rem;

  .lang button.active{ background:var(--accent); color:var(--accent-ink) }

  .search button{ border:1px solid var(--border); background:var(--card); border-radius:10px; padding:.6rem .9rem; cursor:pointer; color:var(--ink) }

  .cats{ display:flex; gap:.5rem; margin:.25rem 0 .9rem; overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none }

  .cat-btn{ border:1px solid var(--border); background:rgba(23,25,35,.75); padding:.55rem .9rem; border-radius:999px; cursor:pointer; font-weight:600; color:var(--ink); white-space:nowrap }
  .cat-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }

  .global-note{
    background:var(--cardGlass);
    border:1px solid var(--border);
    border-radius:14px;
    padding:.75rem .9rem;
    margin:.2rem 0 1rem;

  .global-note.empty .global-note-view{ color:var(--muted) }

    width:100%; min-height:84px; border:1px solid var(--border); border-radius:10px;
    padding:.55rem .65rem; background:#0f1115; color:var(--ink); font-size:.98rem;

  .pill.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }

  .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem }
  @media (max-width:540px){ .gallery{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) } }

  figure{
    display:flex; flex-direction:column; gap:.55rem;
    background:var(--cardGlass);
    border:1px solid var(--border); border-radius:14px;

  figure img{ max-width:100%; height:auto; display:block; object-fit:contain; border-radius:6px; cursor:zoom-in }

  .note-text{ width:100%; font-size:.92rem; color:var(--ink); white-space:pre-wrap; word-break:break-word; }

const DEFAULT_LANG='fi';
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function currentLang(){
  return localStorage.getItem('lang')
      || (navigator.language||'fi').slice(0,2).replace(/^(en|sv|de)$/,'$1') || DEFAULT_LANG;
}
function t(key, lang){
  const dict = translations[lang] || translations[DEFAULT_LANG];
  return key.split('.').reduce((o,k)=>o && o[k], dict);
}
function setLang(lang){
  $$('[data-i18n]').forEach(el=>{
    const val = t(el.getAttribute('data-i18n'), lang);
    if (typeof val === 'string') el.textContent = val;
  });
  $$('[data-i18n-attr]').forEach(el=>{
    const pairs = el.getAttribute('data-i18n-attr').split(',').map(s=>s.trim());
    pairs.forEach(p=>{
      const [attr, key] = p.split(':');
      const val = t(key, lang);
      if (typeof val === 'string') el.setAttribute(attr, val);
    });
  });

  const titleT = t('meta.title', lang);
  if (titleT) document.title = titleT;

  renderCats(countsFrom(allFiles), lang);

  $$('.lang button').forEach(b=> b.classList.toggle('active', b.dataset.lang===lang));

  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
}

/* ---------- Helpers & state ---------- */
const sanitize = s => (s||"").toString().replace(/\s+/g,' ').trim();
let currentCat='all', allFiles=[], textMap={};
const CATS_ORDER = ["Magneetit","Lappimagneetit","Sormukset","Ranneketjut","Kaulaketjut","Rocks Steel","Riipukset","Seiðr","Puukorut","Muut","Hopeakorut","Hiuskorut","Kellot"];
const isAdmin = ()=> (sessionStorage.getItem('b2b_admin')==='1');

function fetchTxt(url, opt={}, timeoutMs=20000){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), timeoutMs);
  return fetch(url, {...opt, signal: ac.signal})
    .then(async r=>{ const text = await r.text().catch(()=> ''); return { ok:r.ok, status:r.status, text }; })
    .catch(err=>({ ok:false, status:0, text:String(err && err.message || err) }))
    .finally(()=> clearTimeout(t));
}

  refreshUIAfterAuth();

    sessionStorage.clear(); localStorage.removeItem('b2b_cart'); cart.clear(); renderCart();
    document.getElementById('gate').style.display='flex'; document.getElementById('app').setAttribute('aria-hidden','true');
    document.getElementById('passInput').value=''; document.getElementById('nameInput').value=''; document.getElementById('nameInput').focus(); closeCart();
  };
}

/* ---------- Kategoriat & haku ---------- */
const toTitle = s=>s.replace(/[-_]/g,' ').trim().replace(/(^|\s)\S/g,m=>m.toUpperCase());
function countsFrom(list){ const o=Object.fromEntries(CATS_ORDER.map(k=>[k,0])); list.forEach(f=>{ if(o[f.cat]!=null) o[f.cat]++; }); return o; }

function renderCats(counts, lang){
  const wrap = document.getElementById('cats');
  wrap.innerHTML = '';
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const visible = CATS_ORDER.filter(k => (counts[k]||0) > 0);

  if (currentCat !== 'all' && (!counts[currentCat] || counts[currentCat] === 0)) currentCat = 'all';

  const labels = translations[lang]?.catsLabels || translations[DEFAULT_LANG].catsLabels;
  const mk=(k,l,c)=>{ const b=document.createElement('button'); b.className='cat-btn'+(k===currentCat?' active':''); b.dataset.key=k; b.textContent=`${l} (${c})`; return b; };
  wrap.appendChild(mk('all', t('cats.all', lang), total));
  visible.forEach(key=>{ const label = labels[key] || key; wrap.appendChild(mk(key,label,counts[key]||0)); });
}
document.getElementById('cats').addEventListener('click',e=>{
  const b = e.target.closest('.cat-btn'); if(!b) return;
  const key = b.dataset.key;
  if (key !== 'all') { const cntMap = countsFrom(allFiles); if (!cntMap[key]) return; }
  currentCat = key;
  [...document.querySelectorAll('#cats .cat-btn')].forEach(x=>x.classList.toggle('active',x===b));
  showGallery();
});
document.getElementById('q').addEventListener('input',()=>showGallery());
document.getElementById('clear').onclick=()=>{ document.getElementById('q').value=''; showGallery(); };

/* ---------- Yleisviesti ---------- */
function bindGlobalNoteOnce_(){
  const wrap = document.getElementById('globalNote');
  if (wrap._bound) return; wrap._bound = true;

  const view = document.getElementById('globalNoteView');
  const acts = document.getElementById('globalNoteActions');
  const editWrap = document.getElementById('globalNoteEditWrap');
  const ta = document.getElementById('globalNoteTextarea');

  document.getElementById('globalNoteEdit').onclick = ()=>{ editWrap.style.display=''; acts.style.display='none'; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); };
  document.getElementById('globalNoteCancel').onclick = ()=>{ editWrap.style.display='none'; acts.style.display=''; ta.value = view.textContent; };
  document.getElementById('globalNoteSave').onclick = async ()=>{
    const ok = await saveGlobalNote(ta.value);
    if (ok){ renderGlobalNote(ta.value); } else { alert(t('alerts.globalSaveFail', currentLang())); }
  };
}
function renderGlobalNote(text){
  const wrap = document.getElementById('globalNote');
  const view = document.getElementById('globalNoteView');
  const acts = document.getElementById('globalNoteActions');
  const editWrap = document.getElementById('globalNoteEditWrap');
  const ta   = document.getElementById('globalNoteTextarea');

  const ttxt = String(text||'').trim();
  view.textContent = ttxt || t('global.noNote', currentLang());
  wrap.classList.toggle('empty', !ttxt);

  const admin = isAdmin();
  acts.style.display = admin ? '' : 'none';
  editWrap.style.display = 'none';
  if (admin) ta.value = ttxt;

  bindGlobalNoteOnce_();
}
async function loadGlobalNote(){
  try{
    const r = await fetch(GAS_ENDPOINT + "?action=getGlobal", { cache: "no-store" });
    if(!r.ok) throw new Error("net");
    const j = await r.json();
    const txt = (j && typeof j.note === 'string') ? j.note : "";
    renderGlobalNote(txt);
  }catch(_){ renderGlobalNote(""); }
}
async function saveGlobalNote(text){
  const payload = { action: "setGlobal", note: String(text||''), secret: GAS_SECRET };
  try{
    const fd = new FormData(); fd.append('data', JSON.stringify(payload));
    const {ok,text:tres} = await fetchTxt(GAS_ENDPOINT, { method:'POST', body: fd });
    const up = (tres||'').trim().toUpperCase();
    if (ok && up.startsWith('OK')) return true;
    try{ const j=JSON.parse(tres||'{}'); if (j && j.ok) return true; }catch(_){}
  }catch(_){}
  return false;
}

/* ---------- Admin-tekstit (SKU) ---------- */
async function loadTexts(){
  try{
    const r = await fetch(GAS_ENDPOINT + "?action=getNotes", {cache:'no-store'});
    if(r.ok){
      const data = await r.json();
      if (data && Array.isArray(data.notes)){
        const m={}; data.notes.forEach(x=>{ if(x && x.sku!=null) m[String(x.sku)]=String(x.note||''); });
        textMap = m; return;
      }
    }
  }catch(_){}
  textMap = {};
}
async function saveText(sku, text){
  const payload = { action:"setNote", sku:String(sku), note:String(text), secret:GAS_SECRET };
  try{
    const fd = new FormData(); fd.append('data', JSON.stringify(payload));
    const {ok,text:tres} = await fetchTxt(GAS_ENDPOINT, { method:'POST', body: fd });
    const up = (tres||'').trim().toUpperCase();
    if (ok && up.startsWith('OK')){ textMap[sku]=String(text); return true; }
    try{ const j=JSON.parse(tres||'{}'); if (j && j.ok){ textMap[sku]=String(text); return true; } }catch(_){}
  }catch(_){}
  return false;
}

/* ---------- Galleria + lightbox ---------- */
function addFigure(path){
  const file=path.split('/').pop(); const title=toTitle(file.replace(/\.[^.]+$/,'')); const sku=file.replace(/\.[^.]+$/,'');
  const note = textMap[sku] || "";
  const fig=document.createElement('figure');
  fig.dataset.file=file; fig.dataset.path=path; fig.dataset.sku=sku; fig.dataset.title=title;
  fig.innerHTML=`
    <div class="img-wrap"><img src="${path}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" /></div>
    <figcaption>${title}</figcaption>
    <div class="note-line" data-sku="${sku}">
      <div class="note-text"></div>
      ${isAdmin() ? `<button class="pill" data-act="edit" data-i18n="global.edit">${t('global.edit', currentLang())}</button>` : ``}
      <div class="note-edit">
        <textarea></textarea>
        <div class="note-actions">
          <button class="pill primary" data-act="save" data-i18n="actions.save">${t('actions.save', currentLang())}</button>
          <button class="pill" data-act="cancel" data-i18n="actions.cancel">${t('actions.cancel', currentLang())}</button>
        </div>
      </div>
    </div>
    <div class="addrow">
      <input type="text" class="size" data-i18n-attr="placeholder:addrow.sizePh" placeholder="${t('addrow.sizePh', currentLang())}" />
      <input type="number" class="qty" min="1" value="1" />
      <button class="add" type="button" data-i18n="addrow.add">${t('addrow.add', currentLang())}</button>
    </div>`;
  const view = fig.querySelector('.note-text');
  const ta   = fig.querySelector('textarea');
  view.textContent = note;
  ta.value = note;
  document.getElementById('gallery').appendChild(fig);
}
function showGallery(){
  const q=document.getElementById('q').value.trim().toLowerCase(); const gal=document.getElementById('gallery'); gal.innerHTML='';
  const list=allFiles.filter(f=>{
    if(currentCat!=='all' && f.cat!==currentCat) return false;
    if(!q) return true;
    const name=f.name.toLowerCase(), sku=f.name.replace(/\.[^.]+$/,'').toLowerCase();
    return name.includes(q)||sku.includes(q);
  });
  const seen=new Set(); for(const f of list){ if(seen.has(f.path)) continue; seen.add(f.path); addFigure(f.path); }
}
document.getElementById('gallery').addEventListener('click',async e=>{
  const fig=e.target.closest('figure'); if(!fig) return;
  if(e.target.classList.contains('add')){
    const sizeI = fig.querySelector('.size');
    const qtyI  = fig.querySelector('.qty');
    const size  = (sizeI.value||'').trim();
    const qty   = Math.max(1,parseInt(qtyI.value)||1);
    addToCart(fig.dataset.file,size,qty);
    sizeI.value = ''; qtyI.value  = '1'; return;
  }
  if (e.target.dataset.act){
    const line = e.target.closest('.note-line');
    const sku  = line.dataset.sku;
    const view = line.querySelector('.note-text');
    const edit = line.querySelector('.note-edit');
    const ta   = line.querySelector('textarea');
    const editBtn = line.querySelector('[data-act="edit"]');
    if (e.target.dataset.act==='edit'){ edit.style.display='block'; if(editBtn) editBtn.style.display='none'; ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); return; }
    if (e.target.dataset.act==='cancel'){ edit.style.display='none'; if(editBtn) editBtn.style.display=''; ta.value = textMap[sku] || ""; return; }
    if (e.target.dataset.act==='save'){
      const ok = await saveText(sku, ta.value);
      if (ok){ view.textContent = ta.value; edit.style.display='none'; if(editBtn) editBtn.style.display=''; }
      else{ alert(t('alerts.saveFail', currentLang())); }
      return;
    }
  }
  const img=e.target.closest('img'); if(img){ document.getElementById('lightImg').src=img.src; document.getElementById('lightbox').classList.add('show'); document.getElementById('lightbox').setAttribute('aria-hidden','false'); }
});
document.getElementById('closeLb').onclick=()=>{ document.getElementById('lightbox').classList.remove('show'); document.getElementById('lightbox').setAttribute('aria-hidden','true'); document.getElementById('lightImg').src=''; };
document.getElementById('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') document.getElementById('closeLb').click(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('lightbox').classList.contains('show')) document.getElementById('closeLb').click(); });

/* ---------- Ostoskori ---------- */
let cart = new Map();
const cartEl = document.getElementById('cart'), cartCountEl = document.getElementById('cartCount');
const normSize = s => (String(s||'').trim().toLowerCase());
const makeKey  = (filename, size) => `${filename}||${normSize(size)}`;

function renderCart(){
  cartEl.innerHTML='';
  const lang = currentLang();
  for(const [key,item] of cart){
    const niceName = toTitle(String(item.name).replace(/\.[^.]+$/,''));
    const label = item.size ? `${niceName} — ${item.size}` : niceName;
    const row=document.createElement('div'); row.className='cart-row'; row.dataset.key=key;
    row.innerHTML=`<div title="${item.name}">${label}</div>
      <input class="cart-input qty" type="number" min="1" value="${Math.max(1,parseInt(item.qty)||1)}" />
      <button class="rm" title="${t('cart.removeTitle', lang)}" type="button">✕</button>`;
    cartEl.appendChild(row);
  }
  cartCountEl.textContent=[...cart.values()].reduce((a,b)=>a+(Math.max(1,parseInt(b.qty)||1)),0);
  localStorage.setItem('b2b_cart', JSON.stringify([...cart.entries()]));
}

function addToCart(filename,size,qty){
  const key = makeKey(filename, size);
  const it  = cart.get(key) || {name:filename,size:size||'',qty:0};
  it.size = size || it.size;
  it.qty  = Math.max(0,parseInt(it.qty)||0) + Math.max(1,qty||1);
  cart.set(key,it);
  renderCart();
}

function loadCart(){
  try{ const raw=localStorage.getItem('b2b_cart'); if(!raw) return; cart=new Map(JSON.parse(raw)); renderCart(); }catch{}
}

cartEl.addEventListener('input',e=>{
  const row=e.target.closest('.cart-row'); if(!row) return;
  const key=row.dataset.key; const it=cart.get(key); if(!it) return;
  if(e.target.classList.contains('qty')){ it.qty=Math.max(1,parseInt(e.target.value)||1); cart.set(key,it); }
  renderCart();
});
cartEl.addEventListener('click',e=>{
  const row=e.target.closest('.cart-row'); if(!row) return;
  if(e.target.classList.contains('rm')){ cart.delete(row.dataset.key); renderCart(); }
});
document.getElementById('cartClear').onclick=()=>{ if(confirm(t('alerts.clearCart', currentLang()))){ cart.clear(); renderCart(); } };

/* ---------- Liukuva kori ---------- */
const cartPanel    = document.getElementById('cartPanel');
const cartBackdrop = document.getElementById('cartBackdrop');
const cartCloseBtn = document.getElementById('cartClose');
const cartBadgeBtn = document.getElementById('cartBadge');
function openCart(){ cartPanel.classList.add('open'); cartBackdrop.classList.add('on'); document.body.classList.add('noscroll'); }
function closeCart(){ cartPanel.classList.remove('open'); cartBackdrop.classList.remove('on'); document.body.classList.remove('noscroll'); }
if (cartBadgeBtn) cartBadgeBtn.onclick = openCart;
if (cartCloseBtn) cartCloseBtn.onclick = closeCart;
if (cartBackdrop) cartBackdrop.onclick = closeCart;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && cartPanel.classList.contains('open')) closeCart(); });

/* ---------- Lähetys GAS:lle ---------- */
function sendOrder(payload){
  const fd = new FormData();
  fd.append('data', JSON.stringify(payload));
  return fetchTxt(GAS_ENDPOINT, { method:'POST', body: fd });
}
function responseOK(text){
  const t = (text||'').trim();
  if (t.toUpperCase().startsWith('OK')) return true;
  try{ const j = JSON.parse(t); return !!(j && j.ok); }catch(_){}
  return false;
}
document.addEventListener('DOMContentLoaded', () => {
  const btnSend = document.getElementById('cartEmail');
  btnSend.addEventListener('click', async () => {
    try{
      if (cart.size === 0) { alert(t('alerts.cartEmpty', currentLang())); return; }
      const items  = [...cart.values()].map(it => ({ name: it.name, size: it.size || "", qty: Math.max(1, parseInt(it.qty)||1) }));
      const sender = sessionStorage.getItem('b2b_name') || "Tuntematon";
      const note   = document.getElementById('note').value || "";
      const payload = { action:'order', secret: GAS_SECRET, items, sender, note };
      const {ok,status,text} = await sendOrder(payload);
      if (ok && responseOK(text)) {
        alert(t('alerts.orderSent', currentLang()));
        closeCart(); cart.clear(); renderCart(); document.getElementById('note').value='';
      } else {
        let msg = (text||'').trim();
        try{ const j=JSON.parse(text||'{}'); if(j && (j.error||j.mailStatus)){ msg = JSON.stringify(j); } }catch(_){}
        alert('(' + status + '): ' + (msg||''));
      }
    }catch(err){ alert((err && err.message ? err.message : String(err))); }
  });
});

/* ---------- Manifest + kuvat ---------- */
async function loadFromManifest(){
  try{
    const res=await fetch('images/manifest.json',{cache:'no-store'});
    if(!res.ok) throw new Error('not found');
    const manifest=await res.json();
    let files=(manifest.files||[]).filter(p=>/\.(jpe?g|png|gif|webp)$/i.test(p));
    files=[...new Set(files)];
    if(!files.length) throw new Error('empty');

    const byCat=[];
    for(const p of files){
      const parts=p.split('/');
      if(parts.length>=3){
        const cat=parts[1]; byCat.push({path:p,cat,name:p.split('/').pop()});
      }
    }
    const uniq=new Map(); for(const it of byCat){ if(!uniq.has(it.path)) uniq.set(it.path,it); }
    allFiles=[...uniq.values()].sort((a,b)=> a.cat===b.cat ? a.name.localeCompare(b.name,'fi') : a.cat.localeCompare(b.cat,'fi'));

    const catKeys=new Set(CATS_ORDER);
    allFiles=allFiles.filter(x=>catKeys.has(x.cat));

    const cnt = countsFrom(allFiles);
    renderCats(cnt, currentLang());

    await loadTexts();
    showGallery();

    if (currentCat !== 'all' && (!cnt[currentCat] || cnt[currentCat] === 0)) {
      currentCat = 'all';
      renderCats(cnt, currentLang());
    }
  }catch(e){ /* hiljainen galleriavirhe */ }
}

/* ---------- init ---------- */
window.addEventListener('DOMContentLoaded', async ()=>{
  document.querySelectorAll('.lang [data-lang]').forEach(b=> b.addEventListener('click', ()=> { setLang(b.dataset.lang); showGallery(); renderCart(); }));
  setLang(currentLang());
  initGate();
  loadCart();
  await loadFromManifest();
  await loadGlobalNote();
});
</script>
