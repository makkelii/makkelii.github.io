<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suomen 585 Oy – Tukkutilaus</title>

<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#1f2937">

<style>
  :root{
    --bg:#0f1115;
    --ink:#e8eaf0;
    --muted:#bfc3d3;
    --card:#171923;
    --border:#2a2f3e;
    --accent:#e0b85a;
    --accent-ink:#26252a;
  }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg) url("images/bg.webp") center/cover fixed no-repeat;
    overflow-x:hidden;
  }

  header{
    background:rgba(31,41,55,.92);
    color:#f3f4f6;
    padding:.9rem 1rem;
    text-align:center;
    position:sticky; top:0; z-index:5;
    backdrop-filter:saturate(120%) blur(6px);
  }
  header h1{ margin:0; font-size:clamp(1.1rem,3.6vw,1.8rem) }

  .wrap{ max-width:1240px; margin:0 auto; padding:1rem }
  @media (max-width:980px){ .wrap{ grid-template-columns:1fr } }

  /* Työkalupalkki */
  .toolbar{ display:flex; flex-wrap:wrap; gap:.6rem; margin:.7rem 0 1rem }
  .search{ flex:1; min-width:260px; display:flex; gap:.45rem }
  .search input{ flex:1; padding:.6rem .8rem; border:1px solid var(--border); border-radius:10px; background:rgba(15,17,21,.35); color:var(--ink) }
  .search button{ border:1px solid var(--border); background:var(--card); border-radius:10px; padding:.6rem .9rem; cursor:pointer; color:var(--ink) }

  .cats{ display:flex; gap:.5rem; margin:.25rem 0 .9rem; overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none }
  .cats::-webkit-scrollbar{ display:none }
  .cat-btn{ border:1px solid var(--border); background:rgba(23,25,35,.75); padding:.55rem .9rem; border-radius:999px; cursor:pointer; font-weight:600; color:var(--ink); white-space:nowrap }
  .cat-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }

  /* Galleria */
  .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem }
  @media (max-width:540px){ .gallery{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) } }

  figure{
    display:flex; flex-direction:column; gap:.55rem;
    background:rgba(23,25,35,.82);
    border:1px solid var(--border); border-radius:14px;
    padding:.65rem; margin:0; box-shadow:0 2px 10px rgba(0,0,0,.2); min-height:100%;
    backdrop-filter: blur(2px);
  }
  figure .img-wrap{ width:100%; background:#0b0d12; border-radius:10px; display:flex; align-items:center; justify-content:center; min-height: 180px; }
  figure img{ max-width:100%; height:auto; display:block; object-fit:contain; border-radius:6px; cursor:zoom-in }
  figcaption{ margin:.2rem 0 0; font-size:.95rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.4em }
  .sku{ font-size:.8rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

  .addrow{ margin-top:auto; display:grid; gap:.42rem; align-items:center; grid-template-columns:60px 46px 1fr }
  .addrow input{ padding:.42rem .45rem; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--ink); min-width:0; font-size:.9rem }
  .addrow .size{ width:60px; text-align:center; font-size:.92rem }
  .addrow .qty{ width:46px; text-align:center; font-size:.92rem }
  .addrow button{ border:none; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer; padding:.46rem .5rem; width:100%; font-size:.9rem; line-height:1.05; white-space:nowrap }

  /* Ostoskori-paneeli (kaikilla näytöillä sama logiikka) */
  #cartPanel{
    position:fixed; top:0; right:0;
    height:100dvh; width:min(520px,92vw);
    background:rgba(23,25,35,.96);
    border-left:1px solid var(--border);
    padding:1rem; border-radius:0;
    box-shadow:-6px 0 24px rgba(0,0,0,.35);
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:1001; backdrop-filter: blur(6px);

    /* tärkeä: täysin piilossa kun suljettu */
    visibility:hidden;
    pointer-events:none;
  }
  #cartPanel.open{
    transform:translateX(0);
    visibility:visible;
    pointer-events:auto;
  }
  .cart-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.4rem }
  .cart-title{ font-size:1.25rem; font-weight:800 }
  .btn{ border:1px solid var(--border); padding:.6rem .9rem; border-radius:10px; cursor:pointer; font-weight:700; background:var(--card); color:var(--ink) }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
  .btn.danger{ background:#ffe8e8; color:#800; border-color:#ffd0d0 }
  .btn.close{ display:inline-flex; align-items:center; justify-content:center; width:2.4rem; height:2.4rem; font-size:1.25rem; padding:0; border-radius:12px }

  .cart-head{ position:sticky; top:0; z-index:1; background:rgba(23,25,35,.95); padding:.45rem; display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem; font-weight:800; color:var(--muted); border-bottom:1px solid var(--border) }
  .cart-items{ max-height:58vh; overflow:auto; padding:.2rem .4rem }
  .cart-row{ display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem; align-items:center; padding:.35rem 0; border-bottom:1px dashed var(--border) }
  .cart-row:last-child{ border-bottom:none }
  .cart-input{ width:100%; padding:.42rem .55rem; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--ink); text-align:center; font-size:.92rem }
  .rm{ border:none; background:#ffe8e8; color:#6b0000; border-radius:8px; padding:.42rem 0; cursor:pointer; font-weight:800 }

  .note{ width:100%; min-height:90px; padding:.6rem; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--ink); margin-top:.6rem }

  .cart-actions{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.8rem }
  .cart-badge{ position:fixed; top:12px; right:12px; background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:.65rem 1.1rem; font-size:1.05rem; font-weight:800; z-index:900; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer }

  .cart-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:1000 }
  .cart-backdrop.on{ display:block }

  /* Lightbox */
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:1100 }
  .lightbox.show{ display:flex }
  .lightbox img{ max-width:95vw; max-height:92vh; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.6) }
  .lightbox .close{ position:absolute; top:10px; right:12px; background:#fff; color:#222; border:none; border-radius:8px; padding:.4rem .6rem; cursor:pointer; font-weight:700 }

  /* Kirjautumisportti */
  .gate{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1200; background:linear-gradient(180deg, rgba(15,17,21,.80), rgba(15,17,21,.85)), url("images/bg.webp") center/cover no-repeat }
  .gate-card{ background:rgba(23,25,35,.92); border:1px solid var(--border); border-radius:14px; padding:1.2rem; width:min(92vw,400px); box-shadow:0 20px 60px rgba(0,0,0,.35) }
  .gate-card h2{ margin:.2rem 0 .8rem; text-align:center }
  .gate-card input{ width:100%; padding:.7rem .9rem; border:1px solid var(--border); border-radius:10px; margin-bottom:.6rem; background:transparent; color:var(--ink) }
  .gate-card button{ width:100%; padding:.85rem; border:none; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer }
  .gate-err{ color:#ffb5b5; background:#2b0000; border:1px solid #7a0000; border-radius:8px; padding:.5rem .7rem; font-size:.9rem; margin-top:.5rem; display:none; text-align:center }
</style>
</head>
<body>
  <!-- Kirjautuminen -->
  <div class="gate" id="gate" aria-hidden="false">
    <div class="gate-card">
      <h2>Tilausportaali</h2>
      <input id="nameInput" type="text" placeholder="Nimi / yritys" />
      <input id="passInput" type="password" placeholder="Salasana" />
      <button id="passBtn" type="button">Avaa</button>
      <div class="gate-err" id="gateErr">Väärä salasana. Yritä uudelleen.</div>
    </div>
  </div>

  <header><h1>Suomen 585 Oy – Tukkutilaus</h1></header>

  <button class="cart-badge" id="cartBadge">🛒 <span id="cartCount">0</span></button>

  <main class="wrap" aria-hidden="true" id="app">
    <section>
      <div class="toolbar">
        <div class="search">
          <input id="q" type="search" placeholder="Hae nimellä tai SKU:lla…" />
          <button id="clear" type="button">Tyhjennä</button>
        </div>
        <div class="cats" id="cats"></div>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <aside id="cartPanel">
      <div class="cart-top">
        <div class="cart-title">Ostoskori</div>
        <button class="btn close" id="cartClose">✕</button>
      </div>
      <div class="cart-head"><div>Tuote</div><div>Koko</div><div>Kpl</div><div></div></div>
      <div class="cart-items" id="cart"></div>
      <textarea id="note" class="note" placeholder="Lisätiedot…"></textarea>
      <div class="cart-actions">
        <button class="btn danger" id="cartClear">Tyhjennä</button>
        <button class="btn primary" id="cartEmail">Lähetä tilaus</button>
      </div>
    </aside>
  </main>

  <div class="cart-backdrop" id="cartBackdrop"></div>

  <div class="lightbox" id="lightbox"><button class="close" id="closeLb">Sulje</button><img id="lightImg" alt=""></div>

<script>
const GAS_ENDPOINT="https://script.google.com/macros/s/AKfycbx07tW4jk3aeLA6QYI9vTMCwxxmYEQF8uSHZtTu_-dwEjU-tUxrPXH0jcQc7c_1lV5VQA/exec";
const GAS_SECRET="p7yC8sQe-3JrY2bX_Zm9L4tK1vF5wN0h";
const PASSWORD_PLAIN="sala54N4";
const $=s=>document.querySelector(s);

function openApp(){ $('#gate').style.display='none'; $('#app').setAttribute('aria-hidden','false'); }
function initGate(){ const btn=$('#passBtn'), pass=$('#passInput'), name=$('#nameInput'), err=$('#gateErr'); function go(){ if(pass.value===PASSWORD_PLAIN){ sessionStorage.setItem('b2b_authed','1'); openApp(); } else err.style.display='block'; } btn.onclick=go; pass.onkeydown=e=>{if(e.key==='Enter')go();}; name.onkeydown=e=>{if(e.key==='Enter')go();}; if(sessionStorage.getItem('b2b_authed')==='1')openApp(); }

let cart=new Map(); function renderCart(){ $('#cart').innerHTML=''; let c=0; cart.forEach((it,name)=>{ c+=+it.qty; $('#cart').innerHTML+=`<div class="cart-row"><div>${name}</div><input class="cart-input size" value="${it.size}"/><input class="cart-input qty" type="number" value="${it.qty}"/><button class="rm">✕</button></div>`; }); $('#cartCount').textContent=c; localStorage.setItem('b2b_cart',JSON.stringify([...cart])); }
function addToCart(name,size,qty){ let it=cart.get(name)||{size:'',qty:0}; it.size=size; it.qty=+it.qty+qty; cart.set(name,it); renderCart(); }

const cartPanel=$('#cartPanel'), cartBackdrop=$('#cartBackdrop');
function openCart(){ cartPanel.classList.add('open'); cartBackdrop.classList.add('on'); }
function closeCart(){ cartPanel.classList.remove('open'); cartBackdrop.classList.remove('on'); }
$('#cartBadge').onclick=openCart; $('#cartClose').onclick=closeCart; cartBackdrop.onclick=closeCart;

window.addEventListener('DOMContentLoaded',()=>{initGate();});
</script>
</body>
</html>
