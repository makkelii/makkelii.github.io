<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suomen 585 Oy – Tilausportaali</title>

<!-- Faviconit -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#1c1c1c">
<meta name="color-scheme" content="light dark" />

<style>
  :root{
    --bg:#1c1c1c;
    --text:#e5e5e5;
    --muted:#bfc0d2;
    --card:#2a2a2a;
    --border:#3a3a3a;
    --accent:#c8b07e;
    --accent-ink:#1c1c1c;
  }

  *{ box-sizing:border-box }
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--text);
    background:
      linear-gradient(rgba(28,28,28,.70), rgba(28,28,28,.70)),
      url("images/bg.webp") center/cover no-repeat fixed;
  }

  header{ background:#222; color:var(--accent); padding:1rem; text-align:center; border-bottom:1px solid var(--border) }
  header h1{ margin:0; font-size:clamp(1.1rem,3.5vw,1.8rem) }

  .wrap{ max-width:1240px; margin:0 auto; padding:1rem; display:grid; grid-template-columns:1fr 400px; gap:1.2rem }
  @media (max-width:980px){ .wrap{ grid-template-columns:1fr } }

  /* Kirjautumisportti */
  .gate{
    position:fixed; inset:0; z-index:10000;
    display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(rgba(28,28,28,.70), rgba(28,28,28,.70)),
      url("images/bg.webp") center/cover no-repeat;
  }
  .gate-card{
    background:rgba(32,32,32,.96);
    border:1px solid var(--border);
    border-radius:14px;
    padding:1.2rem;
    width:min(92vw,400px);
    box-shadow:0 20px 60px rgba(0,0,0,.35)
  }
  .gate-card h2{ margin:.2rem 0 .8rem; text-align:center; color:var(--accent) }
  .gate-card input{
    width:100%; padding:.7rem .9rem;
    border:1px solid var(--border); border-radius:10px;
    margin-bottom:.6rem; background:transparent; color:var(--text);
    font-size:16px;
  }
  .gate-card button{
    width:100%; padding:.85rem;
    border:none; border-radius:10px;
    background:var(--accent); color:var(--accent-ink);
    font-weight:800; cursor:pointer;
    font-size:16px;
  }
  .gate-err{
    color:#ffb5b5; background:#2b0000; border:1px solid #7a0000;
    border-radius:8px; padding:.5rem .7rem; font-size:.9rem;
    margin-top:.5rem; display:none; text-align:center
  }

  html { -webkit-text-size-adjust: 100%; }
  @supports (-webkit-touch-callout:none) {
    input, select, textarea, button { font-size:16px; }
  }

  /* Ostoskori mobiilissa */
  aside{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:1rem; box-shadow:0 2px 10px rgba(0,0,0,.2); height:max-content;
    position:sticky; top:1rem;
  }
  @media (max-width:768px){
    aside{
      position:fixed;
      bottom:0; left:0; right:0;
      border-radius:14px 14px 0 0;
      max-height:70vh;
      overflow:auto;
      z-index:9999;
      transform:translateY(100%);
      transition:transform .3s ease;
    }
    aside.open{ transform:translateY(0); }
  }

  .cart-badge{ position:fixed; top:12px; right:12px; background:var(--accent); color:#1c1c1c; border-radius:999px; padding:.5rem .9rem; font-weight:800; z-index:1000; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer }
</style>
</head>
<body>
  <!-- Kirjautumisportti -->
  <div class="gate" id="gate" aria-hidden="false">
    <div class="gate-card">
      <h2>Suomen 585 Oy — B2B-portaali</h2>
      <input id="nameInput" type="text" placeholder="Nimi / yritys" autocomplete="name" />
      <input id="passInput" type="password" placeholder="Salasana" autocomplete="current-password" />
      <button id="passBtn" type="button">Avaa</button>
      <div class="gate-err" id="gateErr">Väärä salasana. Yritä uudelleen.</div>
    </div>
  </div>

  <header><h1>Suomen 585 Oy – Tilausportaali</h1></header>

  <!-- Ostoskoriin hyppylinkki -->
  <button class="cart-badge" id="cartBadge">🛒 <span id="cartCount">0</span></button>

  <main class="wrap" aria-hidden="true" id="app">
    <section>
      <div id="status" class="error"></div>
      <div class="toolbar">
        <div class="search">
          <input id="q" type="search" placeholder="Hae SKU:lla…" />
          <button id="clear" type="button">Tyhjennä</button>
        </div>
        <div class="cats" id="cats"></div>
      </div>
      <div class="spinner" id="spin"></div>
      <div class="gallery" id="gallery" aria-live="polite"></div>
      <div style="margin-top:1rem"><a href="index.html" class="btn">← Takaisin</a></div>
    </section>

    <aside id="cartAside">
      <div class="cart-top">
        <div class="cart-title">Ostoskori</div>
        <button class="btn outline" id="logout" type="button">Kirjaudu ulos</button>
      </div>
      <div class="cart-head">
        <div>Tuote / SKU</div><div>Koko</div><div>Kpl</div><div></div>
      </div>
      <div class="cart-items" id="cart"></div>
      <label class="note-label">Lisätiedot:</label>
      <textarea id="note" class="note" placeholder="Vapaa viesti…"></textarea>
      <div class="cart-actions">
        <button class="btn" id="copyOrder" type="button">Kopioi tilaus</button>
        <button class="btn danger" id="cartClear" type="button">Tyhjennä kori</button>
        <button class="btn primary" id="cartEmail" type="button">Lähetä sähköpostilla</button>
      </div>
    </aside>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="closeLb" type="button">Sulje</button>
    <img id="lightImg" alt="">
  </div>

<script>
const GAS_ENDPOINT   = "https://script.google.com/macros/s/AKfycbx07tW4jk3aeLA6QYI9vTMCwxxmYEQF8uSHZtTu_-dwEjU-tUxrPXH0jcQc7c_1lV5VQA/exec";

const PASSWORD_PLAIN = "sala54N4";

function resetViewport(){
  const vp=document.querySelector('meta[name=viewport]');
  if(vp) vp.setAttribute('content','width=device-width, initial-scale=1, viewport-fit=cover');
  window.scrollTo(0,0);
}

/* ... kaikki muut JS-koodit pysyvät samoina (gate, kategoriat, galleria, ostoskori, lähetys, manifest) ... */

/* Ostoskori mobiilissa */
const cartAside=document.getElementById('cartAside');
document.getElementById('cartBadge').onclick=()=>{
  if(window.innerWidth<=768){
    cartAside.classList.toggle('open');
  }else{
    cartAside.scrollIntoView({behavior:'smooth'});
  }
};

/* init */
window.addEventListener('DOMContentLoaded', async ()=>{
  await initGate();
  loadCart();
  loadFromManifest();
  resetViewport();
});
window.addEventListener('pageshow', resetViewport);
window.addEventListener('orientationchange', ()=> setTimeout(resetViewport, 250));
</script>
</body>
</html>
