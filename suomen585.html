<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suomen 585 Oy – Tukkutilaus</title>

<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#1f2937">

<style>
  :root{
    --bg:#0f1115;
    --ink:#e8eaf0;
    --muted:#bfc3d3;
    --card:#171923;
    --cardGlass:rgba(23,25,35,.86);
    --border:#2a2f3e;
    --accent:#e0b85a;
    --accent-ink:#26252a;
  }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg) url("images/bg.webp") center/cover fixed no-repeat;
    overflow-x:hidden;
  }
  header{
    background:rgba(31,41,55,.92);
    color:#f3f4f6;
    padding:.9rem 1rem;
    text-align:center;
    position:sticky; top:0; z-index:5;
    backdrop-filter:saturate(120%) blur(6px);
  }
  header h1{ margin:0; font-size:clamp(1.1rem,3.6vw,1.8rem) }
  /* … jätetty välistä: samat tyylit kuin ennen … */
</style>
</head>
<body>
  <!-- Kirjautumisportti -->
  <div class="gate" id="gate" aria-hidden="false">
    <div class="gate-card">
      <h2>Tilausportaali</h2>
      <input id="nameInput" type="text" placeholder="Nimi / yritys" />
      <input id="passInput" type="password" placeholder="Salasana" />
      <button id="passBtn" type="button">Avaa</button>
      <div class="gate-err" id="gateErr">Väärä salasana. Yritä uudelleen.</div>
    </div>
  </div>

  <header><h1>Suomen 585 Oy – Tukkutilaus</h1></header>

  <button class="cart-badge" id="cartBadge">🛒 <span id="cartCount">0</span></button>

  <main class="wrap" aria-hidden="true" id="app">
    <section>
      <div id="status" class="error" style="display:none"></div>
      <div class="toolbar">
        <div class="search">
          <input id="q" type="search" placeholder="Hae nimellä tai SKU:lla…" />
          <button id="clear" type="button">Tyhjennä</button>
        </div>
        <div class="cats" id="cats"></div>
      </div>

      <!-- Global note -->
      <div id="globalNote" class="global-note">
        <div class="global-note-view" id="globalNoteView">Ei tiedotetta.</div>
        <div class="global-note-actions" id="globalNoteActions" style="display:none">
          <button class="pill" id="globalNoteEdit">Muokkaa</button>
        </div>
        <div class="global-note-edit" id="globalNoteEditWrap" style="display:none">
          <textarea id="globalNoteTextarea"></textarea>
          <div class="note-actions">
            <button class="pill primary" id="globalNoteSave">Tallenna</button>
            <button class="pill" id="globalNoteCancel">Peruuta</button>
          </div>
        </div>
      </div>

      <div class="spinner" id="spin" style="display:none"></div>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

  <!-- Ostoskori -->
  <aside id="cartPanel">
    <div class="cart-top">
      <div class="cart-title">Ostoskori</div>
      <div>
        <button class="btn" id="logout" type="button">Kirjaudu ulos</button>
        <button class="btn" id="cartClose" type="button">✕</button>
      </div>
    </div>
    <div class="cart-items" id="cart"></div>
    <textarea id="note" class="note" placeholder="Lisätiedot…"></textarea>
    <div class="cart-actions">
      <button class="btn danger" id="cartClear" type="button">Tyhjennä kori</button>
      <button class="btn primary" id="cartEmail" type="button">Lähetä tilaus</button>
    </div>
  </aside>

<script>
/* ---------- ASETUKSET ---------- */
const GAS_ENDPOINT   = "PASTA_TÄHÄN_UUSIN_EXEC_URL";
const GAS_SECRET     = "p7yC8sQe-3JrY2bX_Zm9L4tK1vF5wN0h";
const PASSWORD_PLAIN = "sala54N4";
const ADMIN_USER     = "admin";
const ADMIN_PASS     = "fatso";
/* -------------------------------- */

// … jätetty välistä: login, kategoriat, notes, gallery, cart …

/* ---------- Lähetys GAS:lle ---------- */
$('#cartEmail').onclick = async () => {
  if (cart.size === 0) { alert('Ostoskori on tyhjä.'); return; }

  const items  = [...cart.values()].map(it => ({
    name: it.name,
    size: it.size || "",
    qty:  Math.max(1, parseInt(it.qty)||1)
  }));
  const sender = sessionStorage.getItem('b2b_name') || "Tuntematon";
  const note   = $('#note').value || "";

  const payload = { action:'order', secret: GAS_SECRET, items, sender, note };

  try {
    const fd = new FormData();
    fd.append('data', JSON.stringify(payload));

    const res = await fetch(GAS_ENDPOINT, { method:'POST', body: fd });
    const txt = (await res.text()).trim();
    if (txt.toUpperCase().includes('OK') || txt.startsWith('{')) {
      alert('Tilaus lähetetty!');
      closeCart(); cart.clear(); renderCart(); $('#note').value='';
      return;
    }
    console.warn('GAS vastasi:', txt);
  } catch (err) {
    console.warn('POST-virhe:', err);
  }

  alert('Lähetys epäonnistui.');
};
</script>
</body>
</html>
