<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B – Tukkutilaus</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }

    header {
      background: #4B0082; /* Royal purple */
      color: gold;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .container {
      display: flex;
      gap: 1rem;
      padding: 1rem 2rem;
    }

    .gallery {
      flex: 3;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #222;
      border-radius: 8px;
      padding: .8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: .5rem;
    }

    .info {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #ddd;
    }

    .addrow {
      display: grid;
      grid-template-columns: 100px 45px 1fr;
      gap: .3rem;
      align-items: center;
      margin-top: auto;
    }

    .addrow select, .addrow input {
      padding: 0.35rem;
      border-radius: 5px;
      border: none;
      font-size: 0.85rem;
      background: #111;
      color: #fff;
      text-align: center;
    }

    .addrow button {
      background: gold;
      border: none;
      padding: .5rem;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .addrow button:hover {
      background: #d4af37;
    }

    aside {
      flex: 1;
      background: #111;
      border-radius: 8px;
      padding: 1rem;
    }

    aside h2 {
      margin-top: 0;
    }

    .btn-danger {
      background: #ff4d4d;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-copy, .btn-send {
      margin-top: .5rem;
      padding: 0.6rem 1rem;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      display: block;
      width: 100%;
    }

    .btn-copy {
      background: #444;
      color: #fff;
    }

    .btn-send {
      background: gold;
      color: #000;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
    }

    .lightbox.active {
      display: flex;
    }

  </style>
</head>
<body>

<header>B2B – Tukkutilaus</header>

<div class="container">
  <!-- Tuotegalleria -->
  <div class="gallery">
    <div class="card">
      <img src="images/Kaulaketjut/tuote1.jpg" alt="Tuote 1" onclick="openLightbox(this.src)">
      <div class="info">C.S.R.5 50</div>
      <div class="addrow">
        <select class="size">
          <option>Koko</option>
          <option>50</option>
          <option>55</option>
        </select>
        <input type="number" class="qty" value="1" min="1">
        <button>Lisää koriin</button>
      </div>
    </div>
    <!-- Lisää tuotteet tänne -->
  </div>

  <!-- Ostoskori -->
  <aside>
    <h2>Ostoskori</h2>
    <p>Tuote / SKU &nbsp;&nbsp; Koko &nbsp;&nbsp; Kpl</p>
    <textarea style="width:100%;height:80px" placeholder="Vapaa viesti tukulle…"></textarea>
    <button class="btn-copy">Kopioi tilaus</button>
    <button class="btn-danger">Tyhjennä kori</button>
    <button class="btn-send">Lähetä sähköpostilla</button>
  </aside>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img src="" alt="">
</div>

<script>
  function openLightbox(src){
    const lb=document.getElementById('lightbox');
    lb.querySelector('img').src=src;
    lb.classList.add('active');
  }
  document.getElementById('lightbox').addEventListener('click',()=> {
    document.getElementById('lightbox').classList.remove('active');
  });
</script>

</body>
</html>
