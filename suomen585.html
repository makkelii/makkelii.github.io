<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suomen 585 Oy – Tukkutilaus</title>

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#1f2937">

<style>
  :root{
    --bg:#0f1115;
    --ink:#e8eaf0;
    --muted:#bfc3d3;
    --card:#171923;
    --border:#2a2f3e;
    --accent:#e0b85a;
    --accent-ink:#26252a;
  }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg) url("images/bg.webp") center/cover fixed no-repeat; color:var(--ink) }

  header{ background:#1f2937; color:#f3f4f6; padding:.9rem 1rem; text-align:center; position:sticky; top:0; z-index:5 }
  header h1{ margin:0; font-size:clamp(1.1rem,3.6vw,1.8rem) }

  .wrap{ max-width:1240px; margin:0 auto; padding:1rem; display:grid; grid-template-columns:1fr 400px; gap:1.2rem }
  @media (max-width:980px){ .wrap{ grid-template-columns:1fr } }

  .toolbar{ display:flex; flex-wrap:wrap; gap:.6rem; margin:.7rem 0 1rem }
  .search{ flex:1; min-width:260px; display:flex; gap:.45rem }
  .search input{ flex:1; padding:.6rem .8rem; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--ink) }
  .search button{ border:1px solid var(--border); background:var(--card); border-radius:10px; padding:.6rem .9rem; cursor:pointer; color:var(--ink) }

  .cats{ display:flex; gap:.5rem; margin:.25rem 0 .9rem; overflow:auto; scrollbar-width:none }
  .cats::-webkit-scrollbar{ display:none }
  .cat-btn{ border:1px solid var(--border); background:var(--card); padding:.55rem .9rem; border-radius:999px; cursor:pointer; font-weight:600; color:var(--ink); white-space:nowrap }
  .cat-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }

  .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem }
  @media (max-width:540px){ .gallery{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) } }

  figure{
    display:flex; flex-direction:column; gap:.55rem;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:.65rem; margin:0; box-shadow:0 2px 10px rgba(0,0,0,.2); min-height:100%;
  }
  figure .img-wrap{ width:100%; background:#0b0d12; border-radius:10px; display:flex; align-items:center; justify-content:center; min-height:180px }
  figure img{ max-width:100%; height:auto; display:block; object-fit:contain; border-radius:6px }
  figcaption{ margin:.2rem 0 0; font-size:.95rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .sku{ font-size:.8rem; color:var(--muted) }

  .addrow{ margin-top:auto; display:grid; gap:.42rem; align-items:center; grid-template-columns: 60px 46px 1fr }
  .addrow input{ padding:.42rem .45rem; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--ink); min-width:0; font-size:.9rem }
  .addrow .size{ width:60px; text-align:center; font-size:.92rem }
  .addrow .qty{ width:46px; text-align:center; font-size:.92rem }
  .addrow button{ border:none; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer; padding:.46rem .5rem; width:100%; font-size:.9rem; line-height:1.05 }

  aside{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1rem; box-shadow:0 2px 10px rgba(0,0,0,.2); height:max-content; position:sticky; top:1rem; z-index:2 }
  .cart-top{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin-bottom:.4rem }
  .cart-title{ margin:.2rem 0; font-size:1.25rem; font-weight:800 }
  .btn{ border:1px solid var(--border); padding:.6rem .9rem; border-radius:10px; cursor:pointer; font-weight:700; background:var(--card); color:var(--ink) }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
  .btn.danger{ background:#ffe8e8; color:#800; border-color:#ffd0d0 }
  .btn.outline{ background:transparent; color:var(--accent); border-color:var(--accent) }
  .btn.outline:hover{ background:rgba(224,184,90,.12) }

  .cart-badge{
    position:fixed; top:12px; right:12px;
    background:var(--accent); color:var(--accent-ink);
    border-radius:999px;
    padding:.65rem 1.1rem;
    font-size:1.05rem;
    font-weight:800;
    z-index:900;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    cursor:pointer;
  }

  .cart-head{ display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem; font-weight:800; color:var(--muted); border-bottom:1px solid var(--border); margin-bottom:.5rem }
  .cart-items{ max-height:58vh; overflow:auto }
  .cart-row{ display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem; align-items:center; padding:.35rem 0; border-bottom:1px dashed var(--border) }
  .cart-row:last-child{ border-bottom:none }

  .cart-input{ width:100%; padding:.42rem .55rem; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--ink); text-align:center; font-size:.92rem }

  .rm{ border:none; background:#ffe8e8; color:#6b0000; border-radius:8px; padding:.42rem 0; cursor:pointer; font-weight:800; line-height:1; text-align:center }

  .btn.close{ display:none }

  @media (max-width:640px){
    .btn.close{
      display:inline-flex;
      align-items:center; justify-content:center;
      width:2.4rem; height:2.4rem;
      font-size:1.25rem;
      padding:0;
      border-radius:12px;
    }
  }

  .gate{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1200; background:linear-gradient(180deg, rgba(15,17,21,.80), rgba(15,17,21,.85)), url("images/bg.webp") center/cover no-repeat }
  .gate-card{ background:rgba(23,25,35,.92); border:1px solid var(--border); border-radius:14px; padding:1.2rem; width:min(92vw,400px) }
  .gate-card h2{ margin:.2rem 0 .8rem; text-align:center }
  .gate-card input{ width:100%; padding:.7rem .9rem; border:1px solid var(--border); border-radius:10px; margin-bottom:.6rem; background:transparent; color:var(--ink) }
  .gate-card button{ width:100%; padding:.85rem; border:none; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer }
  .gate-err{ color:#ffb5b5; background:#2b0000; border:1px solid #7a0000; border-radius:8px; padding:.5rem .7rem; font-size:.9rem; margin-top:.5rem; display:none; text-align:center }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <h2>Tilausportaali</h2>
    <input id="nameInput" type="text" placeholder="Nimi / yritys" />
    <input id="passInput" type="password" placeholder="Salasana" />
    <button id="passBtn">Avaa</button>
    <div class="gate-err" id="gateErr">Väärä salasana.</div>
  </div>
</div>

<header><h1>Suomen 585 Oy – Tukkutilaus</h1></header>

<button class="cart-badge" id="cartBadge">🛒 <span id="cartCount">0</span></button>

<main class="wrap" id="app" aria-hidden="true">
  <section>
    <div id="status" class="error"></div>
    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" placeholder="Hae nimellä tai SKU:lla…" />
        <button id="clear" type="button">Tyhjennä</button>
      </div>
      <div class="cats" id="cats"></div>
    </div>
    <div class="spinner" id="spin"></div>
    <div class="gallery" id="gallery"></div>
    <div style="margin-top:1rem"><a href="index.html" class="btn">← Takaisin</a></div>
  </section>
  <aside id="cartPanel">
    <div class="cart-top">
      <div class="cart-title">Ostoskori</div>
      <button class="btn close" id="cartClose">✕</button>
    </div>
    <div class="cart-head"><div>Tuote</div><div>Koko</div><div>Kpl</div><div></div></div>
    <div class="cart-items" id="cart"></div>
    <textarea id="note" class="note" placeholder="Lisätiedot…"></textarea>
    <div class="cart-actions">
      <button class="btn danger" id="cartClear">Tyhjennä</button>
      <button class="btn primary" id="cartEmail">Lähetä</button>
    </div>
  </aside>
</main>

<script>
const GAS_ENDPOINT="https://script.google.com/macros/s/AKfycbx07tW4jk3aeLA6QYI9vTMCwxxmYEQF8uSHZtTu_-dwEjU-tUxrPXH0jcQc7c_1lV5VQA/exec";
const GAS_SECRET="p7yC8sQe-3JrY2bX_Zm9L4tK1vF5wN0h";
const PASSWORD_PLAIN="sala54N4";

const $=s=>document.querySelector(s);let cart=new Map();

function openApp(){ $('#gate').style.display='none'; $('#app').setAttribute('aria-hidden','false'); }
$('#passBtn').onclick=()=>{ if($('#passInput').value===PASSWORD_PLAIN){ openApp(); } else { $('#gateErr').style.display='block'; } };

function renderCart(){ const cartEl=$('#cart'); cartEl.innerHTML=''; let total=0; for(const [n,it] of cart){ const row=document.createElement('div'); row.className='cart-row'; row.innerHTML=`<div>${n}</div><input class="cart-input size" value="${it.size||''}"><input class="cart-input qty" type="number" min="1" value="${it.qty}"><button class="rm">✕</button>`; cartEl.appendChild(row); total+=it.qty; } $('#cartCount').textContent=total; }
function addToCart(name,size,qty){ cart.set(name,{size,qty:(cart.get(name)?.qty||0)+qty}); renderCart(); }

$('#gallery').addEventListener('click',e=>{ const fig=e.target.closest('figure'); if(!fig) return; if(e.target.classList.contains('add')){ const size=fig.querySelector('.size').value; const qty=parseInt(fig.querySelector('.qty').value)||1; addToCart(fig.dataset.file,size,qty); }});

$('#cartClear').onclick=()=>{ cart.clear(); renderCart(); };

$('#cartEmail').onclick=async()=>{ if(cart.size===0){alert("Tyhjä");return;} const items=[...cart.values()]; const payload={secret:GAS_SECRET,items}; await fetch(GAS_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}); alert("Lähetetty!"); };

</script>
</body>
</html>
