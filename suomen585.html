<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suomen 585 Oy – Tukkutilaus</title>

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#1f2937">

<style>
  :root{
    --bg:#0f1115; --ink:#e8eaf0; --muted:#bfc3d3;
    --card:#171923; --border:#2a2f3e;
    --accent:#e0b85a; --accent-ink:#26252a;
  }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg) url("images/bg.webp") center/cover fixed no-repeat;
    overflow-x:hidden; -webkit-text-size-adjust:100%;
  }

  header{
    background:rgba(31,41,55,.92); color:#f3f4f6; padding:.9rem 1rem;
    display:flex; align-items:center; justify-content:space-between; gap:.75rem;
    position:sticky; top:0; z-index:5; backdrop-filter:saturate(120%) blur(6px);
  }
  header h1{ margin:0; font-size:clamp(1.05rem,3.4vw,1.6rem) }

  .wrap{ max-width:1240px; margin:0 auto; padding:1rem;
    display:grid; grid-template-columns:1fr 400px; gap:1.2rem }
  @media (max-width:980px){ .wrap{ grid-template-columns:1fr } }

  /* Työkalupalkki + kategoriat */
  .toolbar{ display:flex; flex-wrap:wrap; gap:.6rem; margin:.6rem 0 1rem }
  .search{ flex:1; min-width:260px; display:flex; gap:.45rem }
  .search input{ flex:1; padding:.6rem .8rem; border:1px solid var(--border); border-radius:10px; background:rgba(15,17,21,.35); color:var(--ink) }
  .search button{ border:1px solid var(--border); background:var(--card); border-radius:10px; padding:.6rem .9rem; cursor:pointer; color:var(--ink) }

  .cats{ display:flex; gap:.5rem; margin:.25rem 0 .9rem; overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none }
  .cats::-webkit-scrollbar{ display:none }
  .cat-btn{ border:1px solid var(--border); background:rgba(23,25,35,.75); padding:.55rem .9rem; border-radius:999px; cursor:pointer; font-weight:600; color:var(--ink); white-space:nowrap }
  .cat-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }

  /* Galleria */
  .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem }
  @media (max-width:540px){ .gallery{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) } }

  figure{
    display:flex; flex-direction:column; gap:.55rem;
    background:rgba(23,25,35,.82);
    border:1px solid var(--border); border-radius:14px;
    padding:.65rem; margin:0; box-shadow:0 2px 10px rgba(0,0,0,.2);
    backdrop-filter: blur(2px);
    min-height:100%;
  }
  figure .img-wrap{
    width:100%; background:#0b0d12; border-radius:10px;
    display:flex; align-items:center; justify-content:center; min-height:180px;
  }
  figure img{ max-width:100%; height:auto; display:block; object-fit:contain; border-radius:6px; cursor:zoom-in }
  figcaption{ margin:.2rem 0 0; font-size:1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

  /* Note (kaikille näkyvä) */
  .note-view{ font-size:.92rem; color:var(--muted); white-space:pre-wrap; margin-top:.15rem }
  .note-view.hidden{ display:none }

  /* Admin-muokkaus */
  .noteField{ width:100%; margin:.45rem 0 .35rem; padding:.5rem .6rem; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,.2); color:var(--ink) }
  .saveBtn{ border:none; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer; padding:.5rem .75rem }

  /* Koko | Kpl | Nappi – mobiilissa nappi omalle riville */
  .addrow{
    margin-top:auto; display:grid; gap:.42rem; align-items:center;
    grid-template-columns: 60px 46px 1fr;
  }
  .addrow input{
    padding:.42rem .45rem; border:1px solid var(--border); border-radius:9px;
    background:transparent; color:var(--ink); min-width:0; font-size:.9rem;
  }
  .addrow .size{ width:60px; text-align:center; font-size:.92rem }
  .addrow .qty{ width:46px; text-align:center; font-size:.92rem }
  .addrow button{
    border:none; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    font-weight:800; cursor:pointer; padding:.46rem .5rem; width:100%;
    font-size:.9rem; line-height:1.05; white-space:nowrap;
  }
  @media (max-width:980px){
    .addrow{ grid-template-columns:1fr 1fr; grid-template-areas:"size qty" "add add"; }
    .addrow .size{ grid-area:size; width:auto }
    .addrow .qty{ grid-area:qty; width:auto }
    .addrow button{ grid-area:add }
  }

  /* Ostoskori: liukuva paneeli */
  .cart-badge{
    background:var(--accent); color:var(--accent-ink);
    border-radius:999px; padding:.65rem 1.1rem; font-size:1.05rem; font-weight:800;
    box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer;
  }
  #cartPanel{
    position:fixed; top:0; right:0; height:100dvh; width:min(92vw,420px);
    background:rgba(23,25,35,.96); border-left:1px solid var(--border);
    padding:1rem; border-radius:0; box-shadow:-6px 0 24px rgba(0,0,0,.35);
    transform:translateX(100%); transition:transform .25s ease;
    z-index:1001; backdrop-filter: blur(6px);
  }
  #cartPanel.open{ transform:translateX(0); }
  .cart-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:1000; }
  .cart-backdrop.on{ display:block; }

  .btn{ border:1px solid var(--border); padding:.6rem .9rem; border-radius:10px; cursor:pointer; font-weight:700; background:var(--card); color:var(--ink) }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
  .btn.danger{ background:#ffe8e8; color:#800; border-color:#ffd0d0 }
  .btn.outline{ background:transparent; color:var(--accent); border-color:var(--accent) }

  .cart-top{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin-bottom:.4rem }
  .cart-title{ margin:.2rem 0; font-size:1.25rem; font-weight:800 }
  .btn.close{ display:inline-flex; align-items:center; justify-content:center; width:2.4rem; height:2.4rem; font-size:1.25rem; padding:0; border-radius:12px; }

  .cart-head{
    position:sticky; top:0; z-index:1;
    background:linear-gradient(0deg, rgba(23,25,35,.95), rgba(23,25,35,.95));
    backdrop-filter:blur(3px);
    padding:.45rem .4rem; margin:-.2rem -.4rem .4rem;
    display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem;
    font-weight:800; color:var(--muted); border-bottom:1px solid var(--border);
  }
  .cart-items{ max-height:calc(100dvh - 260px); overflow:auto; padding:.2rem .4rem }
  .cart-row{
    display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem; align-items:center;
    padding:.35rem 0; border-bottom:1px dashed var(--border)
  }
  .cart-row:last-child{ border-bottom:none }
  .cart-input{ width:100%; padding:.42rem .55rem; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--ink); text-align:center; font-size:.92rem }
  .rm{ border:none; background:#ffe8e8; color:#6b0000; border-radius:8px; padding:.42rem 0; cursor:pointer; font-weight:800; line-height:1; text-align:center }
  .rm:hover{ background:#ffd7d7 }

  .noteArea{ width:100%; min-height:90px; padding:.6rem; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--ink); margin-top:.6rem }

  .error{ display:none; background:#4a1010; border:1px solid #a33; color:#ffdede; padding:.7rem; border-radius:10px; margin-bottom:.75rem; white-space:pre-wrap }
  .spinner{ display:none; place-items:center; margin:.6rem 0 }
  .spinner.on{ display:grid }
  .spinner:before{ content:""; width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite }

  /* Lightbox */
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:1100; }
  .lightbox.show{ display:flex }
  .lightbox img{ max-width:95vw; max-height:92vh; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.6) }
  .lightbox .close{ position:absolute; top:10px; right:12px; background:#fff; color:#222; border:none; border-radius:8px; padding:.4rem .6rem; cursor:pointer; font-weight:700 }

  /* Kirjautumisportti – sama tausta */
  .gate{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1200;
    background:linear-gradient(180deg, rgba(15,17,21,.80), rgba(15,17,21,.85)), url("images/bg.webp") center/cover no-repeat;
  }
  .gate-card{ background:rgba(23,25,35,.92); border:1px solid var(--border); border-radius:14px; padding:1.2rem; width:min(92vw,400px); box-shadow:0 20px 60px rgba(0,0,0,.35) }
  .gate-card h2{ margin:.2rem 0 .8rem; text-align:center }
  .gate-card input{ width:100%; padding:.7rem .9rem; border:1px solid var(--border); border-radius:10px; margin-bottom:.6rem; background:transparent; color:var(--ink) }
  .gate-card button{ width:100%; padding:.85rem; border:none; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer }
  .gate-err{ color:#ffb5b5; background:#2b0000; border:1px solid #7a0000; border-radius:8px; padding:.5rem .7rem; font-size:.9rem; margin-top:.5rem; display:none; text-align:center }
</style>
</head>
<body>
  <!-- Kirjautuminen -->
  <div class="gate" id="gate" aria-hidden="false">
    <div class="gate-card">
      <h2>Tilausportaali</h2>
      <input id="nameInput" type="text" placeholder="Nimi / yritys" autocomplete="name" />
      <input id="passInput" type="password" placeholder="Salasana" autocomplete="current-password" />
      <button id="passBtn" type="button">Avaa</button>
      <div class="gate-err" id="gateErr">Väärä salasana. Yritä uudelleen.</div>
    </div>
  </div>

  <header>
    <h1>Suomen 585 Oy – Tukkutilaus</h1>
    <button class="cart-badge" id="cartBadge" title="Avaa ostoskori">🛒 <span id="cartCount">0</span></button>
  </header>

  <main class="wrap" aria-hidden="true" id="app">
    <section>
      <div class="toolbar">
        <div class="search">
          <input id="q" type="search" placeholder="Hae nimellä/SKU:lla…" />
          <button id="clear" type="button">Tyhjennä</button>
        </div>
        <div class="cats" id="cats"></div>
      </div>

      <div class="error" id="status"></div>
      <div class="spinner" id="spin"></div>
      <div class="gallery" id="gallery" aria-live="polite"></div>

      <div style="margin-top:1rem"><a href="index.html" class="btn">← Takaisin</a></div>
    </section>

    <!-- KORI: liukuva paneeli -->
    <aside id="cartPanel" aria-label="Ostoskori">
      <div class="cart-top">
        <div class="cart-title">Ostoskori</div>
        <div style="display:flex; gap:.5rem; align-items:center;">
          <button class="btn outline" id="logout" type="button" title="Kirjaudu ulos">Kirjaudu ulos</button>
          <button class="btn close" id="cartClose" type="button" aria-label="Sulje kori">✕</button>
        </div>
      </div>

      <div class="cart-head">
        <div>Tuote</div><div>Koko</div><div>Kpl</div><div></div>
      </div>
      <div class="cart-items" id="cart"></div>

      <textarea id="note" class="noteArea" placeholder="Lisätiedot (esim. viite, toimitus)…"></textarea>

      <div class="cart-actions" style="display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap">
        <button class="btn danger" id="cartClear" type="button">Tyhjennä kori</button>
        <button class="btn primary" id="cartEmail" type="button">Lähetä tilaus</button>
      </div>
    </aside>
  </main>

  <div class="cart-backdrop" id="cartBackdrop" aria-hidden="true"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="closeLb" type="button">Sulje</button>
    <img id="lightImg" alt="">
  </div>

<script>
/* ---------- ASETUKSET ---------- */
/* Käytä viimeisintä GAS-osoitettasi */
const GAS_ENDPOINT   = "https://script.google.com/macros/s/AKfycbzq9LxDMU3L0Hcmsk3H37cG-q_XShKZ32OB75Es_rNqNzRPEliT63gF7Fc14P3hWRjkug/exec";
const GAS_SECRET     = "p7yC8sQe-3JrY2bX_Zm9L4tK1vF5wN0h";
const PASSWORD_PLAIN = "sala54N4";       // normaali käyttäjä
const ADMIN_USER     = "admin";
const ADMIN_PASS     = "fatso";
/* -------------------------------- */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sanitize = s => (s||"").toString().replace(/\s+/g,' ').trim();

let IS_ADMIN = false;
let allFiles = [];          // { path, name, cat }
let NOTES   = new Map();    // sku -> note
let CATS    = [];           // löydetyt kategoriat
let currentCat = 'all';

/* ===== Kirjautuminen ===== */
function openApp(){
  $('#gate').style.display='none';
  $('#app').setAttribute('aria-hidden','false');
}
function initGate(){
  const btn=$('#passBtn'), nameI=$('#nameInput'), passI=$('#passInput'), err=$('#gateErr');

  function tryOpen(){
    const given = (passI.value||'').trim();
    const name  = sanitize(nameI.value) || 'Tuntematon';

    // Admin
    if (name === ADMIN_USER && given === ADMIN_PASS) {
      IS_ADMIN = true;
      sessionStorage.setItem('b2b_name', 'ADMIN');
      sessionStorage.setItem('b2b_authed', '1');
      sessionStorage.setItem('b2b_admin', '1');
      openApp();
      initDataAndRender();
      return;
    }
    // Normaali
    if (given === PASSWORD_PLAIN) {
      IS_ADMIN = false;
      sessionStorage.setItem('b2b_name', name);
      sessionStorage.setItem('b2b_authed', '1');
      sessionStorage.removeItem('b2b_admin');
      openApp();
      initDataAndRender();
    } else {
      err.style.display='block';
      passI.focus(); passI.select?.();
    }
  }

  try{
    if(sessionStorage.getItem('b2b_authed')==='1'){
      IS_ADMIN = sessionStorage.getItem('b2b_admin')==='1';
      openApp();
      initDataAndRender();
      return;
    }
  }catch(e){}

  btn.onclick=tryOpen;
  passI.onkeydown=e=>{ if(e.key==='Enter') tryOpen(); };
  nameI.onkeydown=e=>{ if(e.key==='Enter') tryOpen(); };

  // Uloskirjautuminen
  $('#logout').onclick=()=>{
    if(!confirm('Kirjaudutaanko ulos?')) return;
    try{
      sessionStorage.clear();
      localStorage.removeItem('b2b_cart');
    }catch(e){}
    location.reload();
  };
}

/* ===== Apuja ===== */
function toNameFromPath(p){ return p.split('/').pop().replace(/\.[^.]+$/,''); } // SKU = tiedostonimi ilman päätettä
function catFromPath(p){ const parts=p.split('/'); return (parts.length>=3? parts[1] : 'Muut'); }

/* ===== Muistiinpanot (kaikille lataus, admin voi tallentaa) ===== */
async function fetchNotes(){
  try{
    const r = await fetch(GAS_ENDPOINT+'?action=getnotes',{cache:'no-store'});
    const j = await r.json();               // { "sku":"note", ... }
    NOTES.clear();
    Object.entries(j).forEach(([sku,note])=> NOTES.set(String(sku), String(note||'')));
  }catch(e){ /* ei estä sivua */ }
}
async function saveAdminNote(sku, value){
  const payload = { action:'savenote', sku:String(sku), note:String(value), secret:GAS_SECRET };
  try{
    const r = await fetch(GAS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const txt = (await r.text()).trim();
    if (txt === 'OK') return true;
  }catch(e){}
  // Fallback-lomake (ei jää jumiin jos fetch epäonnistuu)
  postViaHiddenForm(GAS_ENDPOINT, payload);
  return true;
}

/* ===== Manifesti + kategoriat ===== */
function buildCategories(files){
  // poimi toiset polkuosat (images/<TÄMÄ>/...)
  const set = new Set();
  files.forEach(p => set.add(catFromPath(p)));
  const arr = [...set].sort((a,b)=> a.localeCompare(b,'fi'));
  CATS = arr;
}
function renderCats(){
  const wrap = $('#cats'); if(!wrap) return;
  wrap.innerHTML = '';
  const btn = (key,label,active=false) => {
    const b=document.createElement('button');
    b.className = 'cat-btn' + (active?' active':'');
    b.dataset.key = key;
    b.textContent = label;
    return b;
  };
  wrap.appendChild(btn('all','Kaikki', currentCat==='all'));
  CATS.forEach(c => wrap.appendChild(btn(c, c, currentCat===c)));
}
$('#cats').addEventListener('click', e=>{
  const b=e.target.closest('.cat-btn'); if(!b) return;
  currentCat = b.dataset.key;
  $$('#cats .cat-btn').forEach(x=>x.classList.toggle('active', x===b));
  showGallery();
});

/* ===== Haku ===== */
$('#q').addEventListener('input', showGallery);
$('#clear').onclick = ()=>{ $('#q').value=''; showGallery(); };

/* ===== Manifestin luku ===== */
async function loadFromManifest(){
  const res=await fetch('images/manifest.json',{cache:'no-store'});
  if(!res.ok) throw new Error('manifest not found');
  const manifest=await res.json();
  let files=(manifest.files||[]).filter(p=>/\.(jpg|jpeg|png|gif|webp)$/i.test(p));
  files=[...new Set(files)];
  // rakenna kategoriat
  buildCategories(files);
  // muodosta tiedot
  allFiles = files.map(p=>({ path:p, name: toNameFromPath(p), cat: catFromPath(p) }));
}

/* ===== Data & render ===== */
async function initDataAndRender(){
  const spin=$('#spin'), status=$('#status');
  spin && (spin.classList.add('on'));
  status && (status.style.display='none', status.textContent='');

  try{
    await loadFromManifest();   // kuvalista + kategoriat
    await fetchNotes();         // kaikkien nähtäväksi
    renderCats();
    showGallery();
  }catch(e){
    if(status){ status.textContent='Kuvien haku epäonnistui. Tarkista, että images/manifest.json on olemassa ja julkinen.'; status.style.display='block'; }
  }finally{
    spin && (spin.classList.remove('on'));
  }
}

/* ===== Galleria ===== */
function addFigure(file){
  const {path, name} = file; // name = SKU
  const note = NOTES.get(name) || '';

  const fig=document.createElement('figure');
  fig.dataset.name=name; fig.dataset.path=path;

  fig.innerHTML=`
    <div class="img-wrap"><img src="${path}" alt="${name}" loading="lazy" /></div>
    <figcaption title="${name}">${name}</figcaption>

    <!-- kaikille näkyvä teksti -->
    <div class="note-view ${note ? '' : 'hidden'}" data-note-view>${note || ''}</div>

    ${IS_ADMIN ? `
      <!-- adminille muokkaus -->
      <textarea class="noteField" rows="2" data-note-edit placeholder="Kuvaus / muistiinpano…">${note}</textarea>
      <button class="saveBtn" type="button" data-save>Tallenna</button>
    ` : ''}

    <div class="addrow" style="margin-top:.5rem">
      <input type="text" class="size" placeholder="Koko" />
      <input type="number" class="qty" min="1" value="1" />
      <button class="add" type="button">Lisää koriin</button>
    </div>`;

  $('#gallery').appendChild(fig);
}

function showGallery(){
  const gal=$('#gallery'); gal.innerHTML='';
  const q = ($('#q').value||'').trim().toLowerCase();

  const list = allFiles.filter(f=>{
    const okCat = (currentCat==='all' || f.cat===currentCat);
    if(!okCat) return false;
    if(!q) return true;
    const base = f.name.toLowerCase();
    return base.includes(q);
  });

  const seen=new Set();
  for(const f of list){
    if(seen.has(f.path)) continue;
    seen.add(f.path);
    addFigure(f);
  }
}

/* Kuva suurennus & admin tallennus */
$('#gallery').addEventListener('click',async (e)=>{
  const fig=e.target.closest('figure'); if(!fig) return;

  // Lisää koriin
  if(e.target.classList.contains('add')){
    const size=(fig.querySelector('.size')||{}).value||'';
    const qty =Math.max(1,parseInt((fig.querySelector('.qty')||{}).value)||1);
    addToCart(fig.dataset.name,size,qty);
    return;
  }

  // Admin tallenna
  if(e.target.matches('[data-save]') && IS_ADMIN){
    const sku  = fig.dataset.name;
    const ta   = fig.querySelector('[data-note-edit]');
    const view = fig.querySelector('[data-note-view]');
    const text = (ta && ta.value) || '';

    const ok = await saveAdminNote(sku, text);
    if (ok){
      view.textContent = text;
      view.classList.toggle('hidden', !text);
      NOTES.set(sku, text);
      alert('Tallennettu!');
    } else {
      alert('Tallennus epäonnistui. Tarkista GAS.');
    }
    return;
  }

  // Lightbox
  const img=e.target.closest('img'); if(img){
    $('#lightImg').src=img.src;
    $('#lightbox').classList.add('show');
    $('#lightbox').setAttribute('aria-hidden','false');
  }
});
$('#closeLb').onclick=()=>{ $('#lightbox').classList.remove('show'); $('#lightbox').setAttribute('aria-hidden','true'); $('#lightImg').src=''; };
$('#lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') $('#closeLb').click(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#lightbox').classList.contains('show')) $('#closeLb').click(); });

/* ===== Ostoskori ===== */
let cart=new Map(); const cartEl=$('#cart'), cartCountEl=$('#cartCount');

function renderCart(){
  cartEl.innerHTML='';
  for(const [name,item] of cart){
    const row=document.createElement('div'); row.className='cart-row'; row.dataset.key=name;
    row.innerHTML=`
      <div title="${name}">${name}</div>
      <input class="cart-input size" type="text" value="${item.size||''}" placeholder="Koko" />
      <input class="cart-input qty" type="number" min="1" value="${Math.max(1,parseInt(item.qty)||1)}" />
      <button class="rm" title="Poista" type="button">✕</button>`;
    cartEl.appendChild(row);
  }
  cartCountEl.textContent=[...cart.values()].reduce((a,b)=>a+(Math.max(1,parseInt(b.qty)||1)),0);
  localStorage.setItem('b2b_cart', JSON.stringify([...cart.entries()]));
}
function addToCart(name,size,qty){
  const it=cart.get(name)||{name,size:'',qty:0};
  it.size=size||it.size; it.qty=Math.max(0,parseInt(it.qty)||0)+Math.max(1,qty||1);
  cart.set(name,it); renderCart();
}
function loadCart(){ try{ const raw=localStorage.getItem('b2b_cart'); if(!raw) return; cart=new Map(JSON.parse(raw)); renderCart(); }catch{} }
cartEl.addEventListener('input',e=>{
  const row=e.target.closest('.cart-row'); if(!row) return;
  const key=row.dataset.key; const it=cart.get(key); if(!it) return;
  if(e.target.classList.contains('size')) it.size=e.target.value;
  if(e.target.classList.contains('qty'))  it.qty=Math.max(1,parseInt(e.target.value)||1);
  cart.set(key,it); renderCart();
});
cartEl.addEventListener('click',e=>{
  const row=e.target.closest('.cart-row'); if(!row) return;
  if(e.target.classList.contains('rm')){ cart.delete(row.dataset.key); renderCart(); }
});
$('#cartClear').onclick=()=>{ if(confirm('Tyhjennetäänkö kori?')){ cart.clear(); renderCart(); } };

/* Liukuva kori */
const cartPanel    = document.getElementById('cartPanel');
const cartBackdrop = document.getElementById('cartBackdrop');
const cartCloseBtn = document.getElementById('cartClose');
const cartBadgeBtn = document.getElementById('cartBadge');
function openCart(){ cartPanel.classList.add('open'); cartBackdrop.classList.add('on'); document.body.classList.add('noscroll'); }
function closeCart(){ cartPanel.classList.remove('open'); cartBackdrop.classList.remove('on'); document.body.classList.remove('noscroll'); }
if (cartBadgeBtn) cartBadgeBtn.onclick = openCart;
if (cartCloseBtn) cartCloseBtn.onclick = closeCart;
if (cartBackdrop)  cartBackdrop.onclick  = closeCart;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && cartPanel.classList.contains('open')) closeCart(); });

/* ===== Tilaus GAS:lle ===== */
function postViaHiddenForm(url, payloadObj) {
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = url;
  form.target = 'gas_iframe';
  form.style.display = 'none';
  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'data'; // GAS: e.parameter.data (JSON-string)
  input.value = JSON.stringify(payloadObj);
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  setTimeout(()=> form.remove(), 1500);
}
(function ensureIframe(){
  if(!document.getElementById('gas_iframe')){
    const ifr=document.createElement('iframe');
    ifr.name='gas_iframe';
    ifr.id='gas_iframe';
    ifr.hidden=true;
    document.body.appendChild(ifr);
  }
})();
$('#cartEmail').onclick = async () => {
  if (cart.size === 0) { alert('Ostoskori on tyhjä.'); return; }
  const items  = [...cart.values()].map(it => ({ name: it.name, size: it.size || "", qty: Math.max(1, parseInt(it.qty)||1) }));
  const sender = sessionStorage.getItem('b2b_name') || "Tuntematon";
  const note   = $('#note').value || "";
  const payload = { secret: GAS_SECRET, items, sender, note };

  try {
    let res = await fetch(GAS_ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
    let txt = await res.text().catch(()=> '');
    if (txt && txt.trim()==='OK') { alert('Lähetetty!'); closeCart(); return; }
  } catch (_) { /* fallback */ }
  postViaHiddenForm(GAS_ENDPOINT, payload);
  alert('Lähetetty!');
  closeCart();
};

/* ===== init ===== */
window.addEventListener('DOMContentLoaded', ()=>{
  initGate();
  loadCart();
});
</script>
