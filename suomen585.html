<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suomen 585 Oy – Tukkutilaus</title>

<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#1f2937">

<style>
:root{
  --bg:#0f1115;
  --ink:#e8eaf0;
  --muted:#bfc3d3;
  --card:#171923;
  --border:#2a2f3e;
  --accent:#e0b85a;      /* lämmin korostus */
  --accent-ink:#26252a;
}
*{ box-sizing:border-box }
html,body{ height:100%; margin:0; }
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg) url("images/bg.webp") center/cover fixed no-repeat;
  overflow-x:hidden;
}

/* Header */
header{
  position:sticky; top:0; z-index:5;
  background:rgba(31,41,55,.92);
  backdrop-filter:saturate(120%) blur(6px);
  color:#f3f4f6; padding:.9rem 1rem; text-align:center;
}
header h1{ margin:0; font-size:clamp(1.1rem,3.6vw,1.8rem) }

/* layout & toolbar (kevyesti, jätetään kategoriahärpäkkeet pois) */
.wrap{ max-width:1240px; margin:0 auto; padding:1rem; }
#status{ display:none; margin:.5rem 0; background:#4a1010; border:1px solid #a33; color:#ffdede; padding:.7rem; border-radius:10px; }
.toolbar{ display:flex; gap:.6rem; flex-wrap:wrap; margin:.4rem 0 1rem; }
.search{ flex:1; min-width:260px; display:flex; gap:.45rem }
.search input{ flex:1; padding:.6rem .8rem; border:1px solid var(--border); border-radius:10px; background:rgba(15,17,21,.35); color:var(--ink) }
.search button{ border:1px solid var(--border); background:var(--card); border-radius:10px; padding:.6rem .9rem; cursor:pointer; color:var(--ink) }

/* Galleria */
.gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem }
@media (max-width:540px){ .gallery{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) } }

figure{
  display:flex; flex-direction:column; gap:.55rem; margin:0;
  background:rgba(23,25,35,.82); border:1px solid var(--border); border-radius:14px;
  padding:.65rem; box-shadow:0 2px 10px rgba(0,0,0,.2);
}
figure img{ max-width:100%; height:auto; display:block; object-fit:contain; border-radius:6px; cursor:zoom-in }
figcaption{ margin:.2rem 0 .1rem; font-size:.95rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

/* Admin-teksti */
.ptext-display{ color:var(--ink); font-size:.95rem; line-height:1.45; white-space:pre-wrap; }
.ptext-empty{ color:var(--muted); font-style:italic; }
.ptext-edit{ display:none; margin-top:.35rem; }
.ptext-edit textarea{
  width:100%; min-height:70px; padding:.55rem; border:1px solid var(--border);
  border-radius:10px; background:transparent; color:var(--ink); resize:vertical;
}
.ptext-edit .save-btn{
  margin-top:.45rem; padding:.5rem .8rem; border:none; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); font-weight:800; cursor:pointer;
}

/* Add-to-cart – oma rivinsä */
.addrow{ display:flex; gap:.45rem; align-items:center; margin-top:.55rem; flex-wrap:wrap }
.addrow input{
  padding:.42rem .5rem; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--ink); text-align:center;
}
.addrow .size{ width:70px }
.addrow .qty{ width:56px }
.addrow .add{
  border:none; border-radius:9px; background:var(--accent); color:var(--accent-ink);
  font-weight:800; cursor:pointer; padding:.55rem .8rem; flex:1 0 auto;
}

/* Ostoskori (paneeli) */
.cart-badge{
  position:fixed; top:12px; right:12px; z-index:900;
  background:var(--accent); color:var(--accent-ink);
  border-radius:999px; padding:.65rem 1.1rem; font-size:1.05rem; font-weight:800;
  box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer;
}
.cart-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:1000; }
.cart-backdrop.on{ display:block; }
#cartPanel{
  position:fixed; top:0; right:0; z-index:1001;
  height:100dvh; width:min(92vw,420px); transform:translateX(100%);
  background:rgba(23,25,35,.96); border-left:1px solid var(--border);
  padding:1rem; transition:transform .25s ease; backdrop-filter: blur(6px);
}
#cartPanel.open{ transform:translateX(0) }
.btn{ padding:.6rem .9rem; border-radius:10px; border:1px solid var(--border); cursor:pointer }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent) }
.btn.close{ float:right; font-size:1.2rem; }
.cart-row{ display:grid; grid-template-columns:1fr 90px 60px 34px; gap:.6rem; align-items:center; padding:.35rem 0; border-bottom:1px dashed var(--border) }
.cart-row:last-child{ border-bottom:none }
.cart-input{ padding:.42rem .55rem; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--ink); text-align:center }

/* Lightbox */
.lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:1100; }
.lightbox.show{ display:flex }
.lightbox img{ max-width:95vw; max-height:92vh; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.6) }
.lightbox .close{ position:absolute; top:10px; right:12px; background:#fff; color:#222; border:none; border-radius:8px; padding:.4rem .6rem; cursor:pointer; font-weight:700 }

/* Gate (kirjautuminen) */
.gate{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1200;
  background:linear-gradient(180deg, rgba(15,17,21,.80), rgba(15,17,21,.85)), url("images/bg.webp") center/cover no-repeat;
}
.gate-card{
  background:rgba(23,25,35,.92); border:1px solid var(--border); border-radius:14px;
  padding:1.2rem; width:min(92vw,400px); box-shadow:0 20px 60px rgba(0,0,0,.35)
}
.gate-card input, .gate-card button{ width:100%; margin:.4rem 0; padding:.8rem; border-radius:10px; }
.gate-card input{ border:1px solid var(--border); background:transparent; color:var(--ink) }
.gate-card button{ background:var(--accent); border:none; color:var(--accent-ink); font-weight:800; cursor:pointer }
.gate-err{ color:#ffb5b5; display:none; text-align:center; margin-top:.5rem }

/* Logout */
.logout{ position:fixed; top:12px; left:12px; background:var(--card); color:var(--ink); padding:.5rem .9rem; border-radius:8px; cursor:pointer; z-index:950; display:none }
</style>
</head>
<body>

<!-- Login gate -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h2>Tilausportaali</h2>
    <input id="nameInput" type="text" placeholder="Käyttäjätunnus (admin: admin)" />
    <input id="passInput" type="password" placeholder="Salasana" />
    <button id="passBtn" type="button">Avaa</button>
    <div class="gate-err" id="gateErr">Virheellinen tunnus tai salasana</div>
  </div>
</div>

<header><h1>Suomen 585 Oy – Tukkutilaus</h1></header>
<button class="logout" id="logoutBtn">Kirjaudu ulos</button>

<!-- ostoskorimerkki -->
<button class="cart-badge" id="cartBadge">🛒 <span id="cartCount">0</span></button>

<main class="wrap" id="app" aria-hidden="true">
  <div id="status"></div>
  <div class="toolbar">
    <div class="search">
      <input id="q" type="search" placeholder="Hae nimellä tai SKU:lla…" />
      <button id="clear" type="button">Tyhjennä</button>
    </div>
  </div>
  <div class="gallery" id="gallery" aria-live="polite"></div>
</main>

<!-- Cart -->
<div class="cart-backdrop" id="cartBackdrop"></div>
<aside id="cartPanel">
  <button class="btn close" id="cartClose">✕</button>
  <h2>Ostoskori</h2>
  <div id="cart"></div>
  <textarea id="note" class="cart-input" style="width:100%;min-height:90px;margin:.7rem 0;" placeholder="Lisätiedot (esim. viite, toimitus)…"></textarea>
  <div style="display:flex;gap:.6rem;flex-wrap:wrap">
    <button class="btn" id="cartClear" type="button">Tyhjennä kori</button>
    <button class="btn primary" id="cartEmail" type="button">Lähetä tilaus</button>
  </div>
</aside>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="close" id="closeLb" type="button">Sulje</button>
  <img id="lightImg" alt="">
</div>

<script>
/* ======= ASETUKSET ======= */
const GAS_ENDPOINT   = "https://script.google.com/macros/s/AKfycbyxYoPCaeD4E-INzz1JOMSSg_Qgg3oyTl4jNP8mQYzbzRM6yp8onvCV3dgPmcRursicyw/exec"; // sama kuin tilauksissa
const GAS_SECRET     = "p7yC8sQe-3JrY2bX_Zm9L4tK1vF5wN0h";   // sama secret
const USER_PASSWORD  = "sala54N4";  // tavallinen käyttäjä
const ADMIN_USER     = "admin";
const ADMIN_PASS     = "fatso";
/* ======================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sanitize = s => (s||"").toString().replace(/\s+/g,' ').trim();

/* --- Kirjautuminen: admin tai peruskäyttäjä --- */
function openApp(isAdmin){
  $('#gate').style.display='none';
  $('#app').setAttribute('aria-hidden','false');
  $('#logoutBtn').style.display='block';
  sessionStorage.setItem('b2b_authed','1');
  sessionStorage.setItem('b2b_admin', isAdmin ? '1' : '0');
  // Kun kirjaudutaan sisään: lataa tekstit ja galleriat
  loadTexts().then(()=>{ renderAllFigures(); });
}
function logout(){
  sessionStorage.clear();
  location.reload();
}
$('#logoutBtn').onclick = logout;

function initGate(){
  if(sessionStorage.getItem('b2b_authed')==='1'){
    const isAdmin = sessionStorage.getItem('b2b_admin')==='1';
    openApp(isAdmin); return;
  }
  const btn=$('#passBtn'), nameI=$('#nameInput'), passI=$('#passInput'), err=$('#gateErr');
  function tryOpen(){
    const user = sanitize(nameI.value);
    const pass = (passI.value||'').trim();
    if(user===ADMIN_USER && pass===ADMIN_PASS){ openApp(true); return; }
    if(pass===USER_PASSWORD){ openApp(false); return; }
    err.style.display='block'; passI.focus(); passI.select?.();
  }
  btn.onclick=tryOpen;
  passI.onkeydown=e=>{ if(e.key==='Enter') tryOpen(); };
  nameI.onkeydown=e=>{ if(e.key==='Enter') tryOpen(); };
}

/* --- Kevyt haku --- */
$('#q').addEventListener('input', showGallery);
$('#clear').onclick = () => { $('#q').value=''; showGallery(); };

/* --- Lightbox --- */
$('#gallery').addEventListener('click',e=>{
  const img=e.target.closest('img'); if(!img) return;
  $('#lightImg').src=img.src; $('#lightbox').classList.add('show');
});
$('#closeLb').onclick=()=>{ $('#lightbox').classList.remove('show'); $('#lightImg').src=''; };
$('#lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') $('#closeLb').click(); });

/* --- Ostoskori --- */
let cart=new Map(); const cartEl=$('#cart'), cartCountEl=$('#cartCount');
function renderCart(){
  cartEl.innerHTML='';
  for(const [name,item] of cart){
    const row=document.createElement('div'); row.className='cart-row'; row.dataset.key=name;
    row.innerHTML=`
      <div title="${name}">${name}</div>
      <input class="cart-input size" type="text" value="${item.size||''}" placeholder="Koko" />
      <input class="cart-input qty" type="number" min="1" value="${Math.max(1,parseInt(item.qty)||1)}" />
      <button class="btn" data-rm>✕</button>`;
    cartEl.appendChild(row);
  }
  cartEl.onclick=e=>{
    const row=e.target.closest('.cart-row'); if(!row) return;
    const key=row.dataset.key; const it=cart.get(key); if(!it) return;
    if(e.target.matches('[data-rm]')){ cart.delete(key); renderCart(); }
  }
  cartEl.oninput=e=>{
    const row=e.target.closest('.cart-row'); if(!row) return;
    const key=row.dataset.key; const it=cart.get(key); if(!it) return;
    if(e.target.classList.contains('size')) it.size=e.target.value;
    if(e.target.classList.contains('qty'))  it.qty=Math.max(1,parseInt(e.target.value)||1);
    cart.set(key,it);
  };
  cartCountEl.textContent=[...cart.values()].reduce((a,b)=>a+(Math.max(1,parseInt(b.qty)||1)),0);
  localStorage.setItem('b2b_cart', JSON.stringify([...cart.entries()]));
}
function addToCart(filename,size,qty){
  const it=cart.get(filename)||{name:filename,size:'',qty:0};
  it.size=size||it.size; it.qty=Math.max(0,parseInt(it.qty)||0)+Math.max(1,qty||1);
  cart.set(filename,it); renderCart();
}
(function loadCart(){ try{ const raw=localStorage.getItem('b2b_cart'); if(!raw) return; cart=new Map(JSON.parse(raw)); renderCart(); }catch{} })();

/* --- Mobiili/desktop kori aukeaa oikeasta napista --- */
const cartPanel    = $('#cartPanel');
const cartBackdrop = $('#cartBackdrop');
$('#cartBadge').onclick = ()=>{ cartPanel.classList.add('open'); cartBackdrop.classList.add('on'); };
$('#cartClose').onclick  = closeCart;
cartBackdrop.onclick     = closeCart;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCart(); });
function closeCart(){ cartPanel.classList.remove('open'); cartBackdrop.classList.remove('on'); }

/* --- Lähetys GAS:lle (tilaus) --- */
function postViaHiddenForm(url, payloadObj) {
  const form = document.createElement('form');
  form.method = 'POST'; form.action = url; form.target = 'gas_iframe'; form.style.display = 'none';
  const input = document.createElement('input'); input.type='hidden'; input.name='data'; input.value=JSON.stringify(payloadObj);
  form.appendChild(input); document.body.appendChild(form); form.submit(); setTimeout(()=> form.remove(), 1200);
}
(function ensureIframe(){
  if(!document.getElementById('gas_iframe')){
    const ifr=document.createElement('iframe'); ifr.name='gas_iframe'; ifr.id='gas_iframe'; ifr.hidden=true; document.body.appendChild(ifr);
  }
})();
$('#cartEmail').onclick = async () => {
  if (cart.size === 0) { alert('Ostoskori on tyhjä.'); return; }
  const items  = [...cart.values()].map(it => ({ name: it.name, size: it.size || "", qty: Math.max(1, parseInt(it.qty)||1) }));
  const sender = sessionStorage.getItem('b2b_admin')==='1' ? 'ADMIN' : 'Asiakas';
  const note   = $('#note').value || "";
  const payload = { secret: GAS_SECRET, items, sender, note };

  try {
    const res = await fetch(GAS_ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
    const txt = (await res.text?.()) || '';
    if (txt.trim()==='OK') { alert('Lähetetty!'); return; }
  } catch (_) {}
  postViaHiddenForm(GAS_ENDPOINT, payload);
  alert('Lähetetty!');
};

/* ================= ADMIN-TEKSTIT ================= */
/* Tekstien keskitetty tallennus GAS:iin. Jos ei ole (vielä) käytössä, käytetään localStoragea. */
let TEXTS = {};            // { SKU: "teksti" }
let admin = false;

async function loadTexts(){
  admin = sessionStorage.getItem('b2b_admin')==='1';
  // 1) yritä ladata GAS:sta
  try{
    const res = await fetch(GAS_ENDPOINT + '?action=getTexts', {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if (data && typeof data === 'object') TEXTS = data;
    }
  }catch(_){}
  // 2) fallback localStorage
  if(!Object.keys(TEXTS).length){
    try{ TEXTS = JSON.parse(localStorage.getItem('b2b_texts')||'{}'); }catch{}
  }
}
function persistLocal(){
  try{ localStorage.setItem('b2b_texts', JSON.stringify(TEXTS)); }catch{}
}
async function saveTextToGAS(sku, text){
  // Lähetetään yksittäinen teksti
  const payload = { secret: GAS_SECRET, action:"setText", key: sku, text: text||"" };
  try{
    const res = await fetch(GAS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const t = await res.text();
    return t && t.trim()==='OK';
  }catch(_){ return false; }
}

/* ================= Kuvagalleria manifestista ================= */
let ALL_FILES=[];

function toTitle(s){ return s.replace(/[-_]/g,' ').trim().replace(/(^|\s)\S/g,m=>m.toUpperCase()); }

function makeFigure(obj){
  const file = obj.name;             // esim. HL6885.L.jpg
  const title = toTitle(file.replace(/\.[^.]+$/,''));
  const sku = file.replace(/\.[^.]+$/,''); // HL6885.L

  const fig = document.createElement('figure');
  fig.dataset.sku = sku;
  fig.innerHTML = `
    <img src="${obj.path}" alt="${title}" loading="lazy">
    <figcaption>${title}</figcaption>

    <div class="ptext">
      <div class="ptext-display" id="show-${sku}"></div>
      <div class="ptext-edit" id="edit-${sku}">
        <textarea id="ta-${sku}" placeholder="Lisää kuvaus…"></textarea>
        <button class="save-btn" data-save="${sku}">Tallenna</button>
      </div>
    </div>

    <div class="addrow">
      <input type="text" class="size" placeholder="Koko">
      <input type="number" class="qty" min="1" value="1">
      <button class="add" data-add="${sku}">Lisää koriin</button>
    </div>
  `;
  return fig;
}

function bindFigure(fig){
  const sku = fig.dataset.sku;
  // Näytä tekstit
  const content = TEXTS[sku] || '';
  const show = fig.querySelector(`#show-${sku}`);
  const edit = fig.querySelector(`#edit-${sku}`);
  const ta   = fig.querySelector(`#ta-${sku}`);
  show.textContent = content || '';
  if(!content) show.classList.add('ptext-empty');

  if (admin) {
    edit.style.display = 'block';
    ta.value = content || '';
    fig.addEventListener('click', async (e)=>{
      if(e.target.matches('[data-save]')){
        const s = e.target.getAttribute('data-save');
        const newText = (fig.querySelector(`#ta-${s}`)?.value || '').trim();
        TEXTS[s] = newText;
        show.textContent = newText;
        if(!newText) show.classList.add('ptext-empty'); else show.classList.remove('ptext-empty');
        persistLocal();
        const ok = await saveTextToGAS(s, newText);
        if(!ok) alert('Tallennus verkkoon epäonnistui – teksti tallennettu paikallisesti, yritä myöhemmin uudelleen.');
      }
    });
  } else {
    edit.style.display = 'none';
  }

  // Lisää koriin
  fig.addEventListener('click', (e)=>{
    if(!e.target.matches('[data-add]')) return;
    const size = fig.querySelector('.size').value.trim();
    const qty  = Math.max(1, parseInt(fig.querySelector('.qty').value)||1);
    addToCart(`${sku}`, size, qty);
  });
}

function showGallery(){
  const q = ($('#q').value || '').trim().toLowerCase();
  const gal = $('#gallery'); gal.innerHTML = '';
  const list = ALL_FILES.filter(f=>{
    if(!q) return true;
    const name = f.name.toLowerCase();
    const sku  = f.name.replace(/\.[^.]+$/,'').toLowerCase();
    return name.includes(q) || sku.includes(q);
  });
  const seen = new Set();
  list.forEach(f=>{
    if(seen.has(f.path)) return; seen.add(f.path);
    const fig = makeFigure(f); gal.appendChild(fig); bindFigure(fig);
  });
}

function renderAllFigures(){ showGallery(); }

async function loadFromManifest(){
  const st=$('#status'); st.style.display='none'; st.textContent='';
  try{
    const res=await fetch('images/manifest.json',{cache:'no-store'});
    if(!res.ok) throw new Error('manifest not found');
    const manifest=await res.json();
    let files=(manifest.files||[]).filter(p=>/\.(jpg|jpeg|png|gif|webp)$/i.test(p));
    files=[...new Set(files)];
    if(!files.length) throw new Error('empty manifest');

    ALL_FILES = files.map(p => ({ path:p, name:p.split('/').pop() }));
    renderAllFigures();
  }catch(e){
    st.textContent='Kuvien haku epäonnistui. Varmista että images/manifest.json on olemassa ja julkinen.';
    st.style.display='block';
  }
}

/* Init */
window.addEventListener('DOMContentLoaded', async ()=>{
  initGate();           // hoitaa myös admin-flagin
  await loadTexts();    // lataa admin-tekstit (GAS tai localStorage)
  await loadFromManifest();
  renderCart();
});
</script>
</body>
</html>
