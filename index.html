<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title">Suomen 585 Oy</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#1c1c1c">

  <style>
    :root{
      --bg:#1c1c1c;
      --text:#e5e5e5;
      --accent:#c8b07e;
      --accent-wash:rgba(200,176,126,0.1);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}

    body{
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      display:grid;
      place-items:center;
      text-align:center;
      background:
        linear-gradient(rgba(28,28,28,.7),rgba(28,28,28,.7)),
        url("images/bg.webp") center/cover no-repeat fixed;
    }

    .lang{
      position:fixed; top:.6rem; right:.6rem; z-index:20;
      background:rgba(40,40,40,.85); border:1px solid var(--accent-wash); border-radius:10px;
      display:flex; gap:.25rem; padding:.25rem;
    }
    .lang button{
      border:none; background:transparent; color:var(--text); padding:.45rem .55rem; border-radius:8px; cursor:pointer; font-weight:700;
    }
    .lang button.active{ background:var(--accent); color:#1c1c1c }

    .card{
      background:rgba(40,40,40,.85);
      border:2px solid var(--accent-wash);
      border-radius:1.25rem;
      padding:2.5rem 2rem;
      max-width:520px;
      box-shadow:0 8px 28px rgba(0,0,0,.55);
    }
    h1{
      margin:0 0 1rem;
      font-size:clamp(2rem,6vw,3.2rem);
      letter-spacing:.03em;
      color:var(--accent);
    }
    .contact{
      line-height:1.6;
      font-size:1.05rem;
    }
    .contact a{ color:var(--text); text-decoration:none; }
    .contact a:hover{ text-decoration:underline }

    .btnrow{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:1.8rem }
    .portal-btn{
      display:inline-block;
      padding:0.9rem 1.5rem;
      background:var(--accent);
      color:#1c1c1c;
      font-weight:700;
      text-decoration:none;
      border-radius:10px;
      box-shadow:0 3px 8px rgba(0,0,0,.35);
      transition:transform .04s ease, background .2s;
    }
    .portal-btn:active{ transform:translateY(1px) }
    .portal-btn:hover{ background:#d6c597 }

    .info-text{
      margin-top:1.2rem;
      font-size:.95rem;
      color:var(--text);
      opacity:0.85;
      line-height:1.5;
    }

    footer{
      position:fixed;
      bottom:.6rem; left:0; right:0;
      text-align:center;
      font-size:.9rem;
      color:var(--accent-wash);
    }
  </style>
</head>
<body>
  <!-- Kielivalitsin -->
  <nav class="lang" aria-label="Language">
    <button data-lang="fi" aria-label="Suomi">FI</button>
    <button data-lang="en" aria-label="English">EN</button>
    <button data-lang="sv" aria-label="Svenska">SV</button>
    <button data-lang="de" aria-label="Deutsch">DE</button>
  </nav>

  <main>
    <section class="card">
      <h1 data-i18n="hero.title">Suomen 585 Oy</h1>

      <div class="contact">
        Olavi Barman<br>
        <a href="tel:+358400777508">+358 400 777508</a><br>
        <a href="mailto:Suomen585@gmail.com">Suomen585@gmail.com</a>
      </div>

      <div class="btnrow">
        <a href="suomen585.html" class="portal-btn" data-i18n="actions.openPortal">Kirjaudu tilausportaaliin</a>
        <a href="gallery.html" class="portal-btn" data-i18n="actions.openGallery">Avaa kuvagalleria</a>
      </div>

      <p class="info-text" data-i18n="info.portalNote">
        Tilausportaalin käyttäjätunnuksia voit tiedustella ottamalla yhteyttä. Tunnusten saaminen edellyttää Y-tunnusta.
      </p>
    </section>
  </main>

  <footer>© <span id="y"></span> Suomen 585 Oy</footer>

  <script>
  /* -------- i18n -------- */
  const translations = {
    fi: {
      meta:{ title:"Suomen 585 Oy" },
      hero:{ title:"Suomen 585 Oy" },
      actions:{
        openPortal:"Kirjaudu tilausportaaliin",
        openGallery:"Avaa kuvagalleria"
      },
      info:{
        portalNote:"Tilausportaalin käyttäjätunnuksia voit tiedustella ottamalla yhteyttä. Tunnusten saaminen edellyttää Y-tunnusta."
      }
    },
    en:{
      meta:{ title:"Suomen 585 Oy" },
      hero:{ title:"Suomen 585 Oy" },
      actions:{
        openPortal:"Open ordering portal",
        openGallery:"Open image gallery"
      },
      info:{
        portalNote:"You may request ordering portal credentials by contacting us. A valid business ID is required."
      }
    },
    sv:{
      meta:{ title:"Suomen 585 Oy" },
      hero:{ title:"Suomen 585 Oy" },
      actions:{
        openPortal:"Öppna beställningsportalen",
        openGallery:"Öppna bildgalleriet"
      },
      info:{
        portalNote:"Inloggningsuppgifter till beställningsportalen fås genom att kontakta oss. Ett FO-nummer krävs."
      }
    },
    de:{
      meta:{ title:"Suomen 585 Oy" },
      hero:{ title:"Suomen 585 Oy" },
      actions:{
        openPortal:"Zum Bestellportal",
        openGallery:"Bildergalerie öffnen"
      },
      info:{
        portalNote:"Zugangsdaten für das Bestellportal erhalten Sie auf Anfrage. Eine gültige Unternehmens-ID ist erforderlich."
      }
    }
  };

  const DEFAULT_LANG = 'fi';
  const $ = s=>document.querySelector(s);
  const $$= s=>[...document.querySelectorAll(s)];

  function getLang(){
    return localStorage.getItem('lang')
        || (navigator.language||'fi').slice(0,2).replace(/^(en|sv|de)$/,'$1') || DEFAULT_LANG;
  }
  function setLang(lang){
    const dict = translations[lang]||translations[DEFAULT_LANG];

    $$('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      const val = key.split('.').reduce((o,k)=>o&&o[k], dict);
      if (typeof val === 'string') el.textContent = val;
    });

    document.title = dict?.meta?.title || document.title;

    $$('.lang button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;
  }

  $$('.lang [data-lang]').forEach(b=> b.addEventListener('click', ()=> setLang(b.dataset.lang)));

  document.getElementById('y').textContent = new Date().getFullYear();
  setLang(getLang());
  </script>
</body>
</html>
