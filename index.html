<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.title">Suomen 585 Oy</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#1c1c1c">

  <style>
    :root{
      --bg:#1c1c1c;
      --text:#e5e5e5;
      --accent:#c8b07e;
      --accent-wash:rgba(200,176,126,0.1);
    }

    *{box-sizing:border-box}

    html{
      min-height:100%;
      margin:0;
      background:var(--bg);
    }

    body{
      min-height:100vh;
      min-height:100svh;
      margin:0;
      padding:4.5rem 1rem 1rem;
      font-family:"Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      background:
        linear-gradient(rgba(28,28,28,.7),rgba(28,28,28,.7)),
        url("images/bg.webp") center/cover no-repeat fixed;
    }

    .lang{
      position:fixed;
      top:.6rem;
      right:.6rem;
      z-index:20;
      background:rgba(40,40,40,.85);
      border:1px solid var(--accent-wash);
      border-radius:10px;
      display:flex;
      gap:.25rem;
      padding:.25rem;
    }

    .lang button{
      border:none;
      background:transparent;
      color:var(--text);
      padding:.45rem .55rem;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }

    .lang button.active{
      background:var(--accent);
      color:#1c1c1c;
    }

    main{
      width:100%;
      max-width:520px;
      margin:auto 0;
      flex-shrink:0;
    }

    .card{
      width:100%;
      background:rgba(40,40,40,.85);
      border:2px solid var(--accent-wash);
      border-radius:1.25rem;
      padding:2.5rem 2rem;
      box-shadow:0 8px 28px rgba(0,0,0,.55);
    }

    h1{
      margin:0 0 1rem;
      font-size:clamp(2rem,6vw,3.2rem);
      letter-spacing:.03em;
      color:var(--accent);
    }

    .contact{
      line-height:1.6;
      font-size:1.05rem;
    }

    .contact a{
      color:var(--text);
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
    }

    .btnrow{
      display:flex;
      gap:.8rem;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:1.8rem;
    }

    .portal-btn{
      display:inline-block;
      padding:0.9rem 1.5rem;
      background:var(--accent);
      color:#1c1c1c;
      font-weight:700;
      text-decoration:none;
      border-radius:10px;
      box-shadow:0 3px 8px rgba(0,0,0,.35);
      transition:transform .04s ease, background .2s;
    }

    .portal-btn:active{
      transform:translateY(1px);
    }

    .portal-btn:hover{
      background:#d6c597;
    }

    .info-text{
      margin-top:1.2rem;
      font-size:.95rem;
      color:var(--text);
      opacity:0.85;
      line-height:1.5;
    }

    .video-section{
      margin-top:2rem;
      padding-top:1.5rem;
      border-top:1px solid var(--accent-wash);
    }

    .video-section h2{
      margin:0 0 1rem;
      font-size:clamp(1.3rem,4vw,1.65rem);
      color:var(--accent);
    }

    .video-wrapper{
      position:relative;
      width:100%;
      aspect-ratio:16 / 9;
      overflow:hidden;
      border-radius:10px;
      background:#000;
      box-shadow:0 3px 12px rgba(0,0,0,.35);
    }

    .video-wrapper iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    .video-link{
      display:inline-block;
      margin-top:.85rem;
      color:var(--accent);
      font-size:.9rem;
      text-underline-offset:3px;
    }

    footer{
      flex-shrink:0;
      padding-top:1.5rem;
      text-align:center;
      font-size:.9rem;
      color:var(--accent);
      opacity:.6;
    }

    @media (max-width:480px){
      .card{
        padding:2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Kielivalitsin -->
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="fi" aria-label="Suomi">FI</button>
    <button type="button" data-lang="en" aria-label="English">EN</button>
    <button type="button" data-lang="sv" aria-label="Svenska">SV</button>
    <button type="button" data-lang="de" aria-label="Deutsch">DE</button>
  </nav>

  <main>
    <section class="card">
      <h1 data-i18n="hero.title">Suomen 585 Oy</h1>

      <div class="contact">
        Olavi Barman<br>
        <a href="tel:+358400777508">+358 400 777508</a><br>
        <a href="mailto:Suomen585@gmail.com">Suomen585@gmail.com</a>
      </div>

      <div class="btnrow">
        <a
          href="suomen585.html"
          class="portal-btn"
          data-i18n="actions.openPortal"
        >Kirjaudu tilausportaaliin</a>

        <a
          href="gallery.html"
          class="portal-btn"
          data-i18n="actions.openGallery"
        >Avaa kuvagalleria</a>
      </div>

      <p class="info-text" data-i18n="info.portalNote">
        Tilausportaalin käyttäjätunnuksia voit tiedustella ottamalla yhteyttä.
        Tunnusten saaminen edellyttää Y-tunnusta.
      </p>

      <!-- Caravan seinäkello -->
      <section class="video-section" aria-labelledby="video-heading">
        <h2 id="video-heading" data-i18n="video.title">
          Caravan seinäkello
        </h2>

        <div class="video-wrapper">
          <iframe
            src="https://www.youtube-nocookie.com/embed/8tkeg675b00"
            title="Caravan seinäkello – esittelyvideo"
            data-i18n-title="video.iframeTitle"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>

        <a
          class="video-link"
          href="https://youtu.be/8tkeg675b00"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="video.watchOnYoutube"
        >Katso YouTubessa</a>
      </section>
    </section>
  </main>

  <footer>© <span id="y"></span> Suomen 585 Oy</footer>

  <script>
    /* -------- i18n -------- */
    const translations = {
      fi:{
        meta:{ title:"Suomen 585 Oy" },
        hero:{ title:"Suomen 585 Oy" },
        actions:{
          openPortal:"Kirjaudu tilausportaaliin",
          openGallery:"Avaa kuvagalleria"
        },
        info:{
          portalNote:"Tilausportaalin käyttäjätunnuksia voit tiedustella ottamalla yhteyttä. Tunnusten saaminen edellyttää Y-tunnusta."
        },
        video:{
          title:"Caravan seinäkello",
          iframeTitle:"Caravan seinäkello – esittelyvideo",
          watchOnYoutube:"Katso YouTubessa"
        }
      },
      en:{
        meta:{ title:"Suomen 585 Oy" },
        hero:{ title:"Suomen 585 Oy" },
        actions:{
          openPortal:"Open ordering portal",
          openGallery:"Open image gallery"
        },
        info:{
          portalNote:"You may request ordering portal credentials by contacting us. A valid business ID is required."
        },
        video:{
          title:"Caravan wall clock",
          iframeTitle:"Caravan wall clock – product video",
          watchOnYoutube:"Watch on YouTube"
        }
      },
      sv:{
        meta:{ title:"Suomen 585 Oy" },
        hero:{ title:"Suomen 585 Oy" },
        actions:{
          openPortal:"Öppna beställningsportalen",
          openGallery:"Öppna bildgalleriet"
        },
        info:{
          portalNote:"Inloggningsuppgifter till beställningsportalen fås genom att kontakta oss. Ett FO-nummer krävs."
        },
        video:{
          title:"Caravan väggklocka",
          iframeTitle:"Caravan väggklocka – produktvideo",
          watchOnYoutube:"Se på YouTube"
        }
      },
      de:{
        meta:{ title:"Suomen 585 Oy" },
        hero:{ title:"Suomen 585 Oy" },
        actions:{
          openPortal:"Zum Bestellportal",
          openGallery:"Bildergalerie öffnen"
        },
        info:{
          portalNote:"Zugangsdaten für das Bestellportal erhalten Sie auf Anfrage. Eine gültige Unternehmens-ID ist erforderlich."
        },
        video:{
          title:"Caravan-Wanduhr",
          iframeTitle:"Caravan-Wanduhr – Produktvideo",
          watchOnYoutube:"Auf YouTube ansehen"
        }
      }
    };

    const DEFAULT_LANG = 'fi';
    const $$ = selector => [...document.querySelectorAll(selector)];

    function isSupportedLang(lang){
      return Object.prototype.hasOwnProperty.call(translations, lang);
    }

    function getLang(){
      let savedLang = null;

      try{
        savedLang = localStorage.getItem('lang');
      }catch(error){
        // Kielivalinta toimii myös ilman localStoragea.
      }

      if(isSupportedLang(savedLang)){
        return savedLang;
      }

      const browserLang = (navigator.language || DEFAULT_LANG)
        .slice(0, 2)
        .toLowerCase();

      return isSupportedLang(browserLang) ? browserLang : DEFAULT_LANG;
    }

    function getTranslation(dict, key){
      return key.split('.').reduce((value, part) => {
        return value && value[part];
      }, dict);
    }

    function setLang(lang){
      if(!isSupportedLang(lang)){
        lang = DEFAULT_LANG;
      }

      const dict = translations[lang];

      $$('[data-i18n]').forEach(el => {
        const value = getTranslation(dict, el.getAttribute('data-i18n'));

        if(typeof value === 'string'){
          el.textContent = value;
        }
      });

      // Päivitetään myös videokehyksen saavutettava otsikko.
      $$('[data-i18n-title]').forEach(el => {
        const value = getTranslation(
          dict,
          el.getAttribute('data-i18n-title')
        );

        if(typeof value === 'string'){
          el.setAttribute('title', value);
        }
      });

      document.title = dict.meta.title;

      $$('.lang button').forEach(button => {
        const active = button.dataset.lang === lang;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });

      try{
        localStorage.setItem('lang', lang);
      }catch(error){
        // Tallennuksen estyminen ei estä kielen vaihtamista.
      }

      document.documentElement.lang = lang;
    }

    $$('.lang [data-lang]').forEach(button => {
      button.addEventListener('click', () => {
        setLang(button.dataset.lang);
      });
    });

    document.getElementById('y').textContent = new Date().getFullYear();
    setLang(getLang());
  </script>
</body>
</html>
