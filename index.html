<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suomen 585 Oy</title>

  <!-- Faviconit -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#1c1c1c">

  <style>
    :root{
      --bg:#1c1c1c;         /* tumma tausta */
      --text:#e5e5e5;       /* vaalea teksti */
      --accent:#c8b07e;     /* hillitty beige/pronssi */
      --accent-wash:rgba(200,176,126,0.1);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}

    body{
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      display:grid;
      place-items:center;
      text-align:center;

      /* Taustakuva (muokkaa tiedostonimeä tarvittaessa) */
      background:
        linear-gradient(rgba(28,28,28,.7),rgba(28,28,28,.7)),
        url("images/bg.webp") center/cover no-repeat fixed;
    }

    .card{
      background:rgba(40,40,40,.85);
      border:2px solid var(--accent-wash);
      border-radius:1.25rem;
      padding:2.5rem 2rem;
      max-width:480px;
      box-shadow:0 8px 28px rgba(0,0,0,.55);
    }
    h1{
      margin:0 0 1rem;
      font-size:clamp(2rem,6vw,3.2rem);
      letter-spacing:.03em;
      color:var(--accent);
    }
    h2{
      font-size:1.25rem;
      margin-top:1.5rem;
      margin-bottom:.5rem;
      color:var(--accent);
    }
    .contact{
      line-height:1.6;
      font-size:1.05rem;
    }
    .contact a{
      color:var(--text);
      text-decoration:none;
    }
    .contact a:hover{ text-decoration:underline }

    .portal-btn{
      display:inline-block;
      margin-top:1.8rem;
      padding:0.9rem 1.5rem;
      background:var(--accent);
      color:#1c1c1c;
      font-weight:700;
      text-decoration:none;
      border-radius:10px;
      box-shadow:0 3px 8px rgba(0,0,0,.35);
      transition:background .2s;
    }
    .portal-btn:hover{ background:#d6c597 }

    footer{
      position:fixed;
      bottom:.6rem; left:0; right:0;
      text-align:center;
      font-size:.9rem;
      color:var(--accent-wash);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Suomen 585 Oy</h1>

      <div class="contact">
        Olavi Barman<br>
        <a href="tel:+358449721998">+358 400 777508</a><br>
        <a href="mailto:Suomen585@gmail.com">Suomen585@gmail.com</a>
      </div>


      <!-- Tilausportaali-nappi -->
      <div>
        <a href="suomen585.html" class="portal-btn">Avaa tilausportaali</a>
      </div>
    </section>
  </main>

  <footer>© <span id="y"></span> Suomen 585 Oy</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
