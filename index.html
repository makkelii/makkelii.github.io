<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suomen 585 Oy</title>

  <!-- Faviconit -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#3a006b">

  <style>
    :root{
      --purple:#3a006b;
      --gold:#d4af37;
      --gold-wash:rgba(212,175,55,0.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}

    body{
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      color:var(--gold);
      display:grid;
      place-items:center;
      text-align:center;

      /* Taustakuva + tumma kalvo luettavuuden vuoksi */
      background:
        linear-gradient(rgba(20,10,40,.65),rgba(20,10,40,.65)),
        url("images/bg.webp") center/cover no-repeat fixed;
    }

    .top-btn{
      position:absolute;
      top:1rem; right:1rem;
      background:var(--gold);
      color:var(--purple);
      padding:.7rem 1.2rem;
      border-radius:8px;
      font-weight:700;
      text-decoration:none;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
      transition:background .2s;
    }
    .top-btn:hover{background:#e1c45c}

    .card{
      background:rgba(58,0,107,.8);
      border:2px solid var(--gold-wash);
      border-radius:1.25rem;
      padding:2.5rem 2rem;
      max-width:480px;
      box-shadow:0 8px 28px rgba(0,0,0,.55);
    }
    h1{
      margin:0 0 1rem;
      font-size:clamp(2rem,6vw,3.5rem);
      letter-spacing:.05em;
    }
    h2{
      font-size:1.25rem;
      margin-top:1.5rem;
      margin-bottom:.5rem;
    }
    .contact{
      line-height:1.6;
      font-size:1.05rem;
    }
    .contact a{
      color:var(--gold);
      text-decoration:none;
    }
    .contact a:hover{ text-decoration:underline }
    footer{
      position:fixed;
      bottom:.6rem; left:0; right:0;
      text-align:center;
      font-size:.9rem;
      color:var(--gold-wash);
    }
  </style>
</head>
<body>
  <!-- Painike Suomen 585 Oy -sivulle -->
  <a href="suomen585.html" class="top-btn">Tilausportaali</a>

  <main>
    <section class="card">
      <h1>Suomen 585 Oy</h1>

      <h2></h2>
      <div class="contact">
        Olavi Barman<br>
        <a href="tel:+358449721998">+358 40 0777 508</a><br>
        <a href="mailto:Barmanol@gmail.com">Barmanol@gmail.com</a>
      </div>

     
    </section>
  </main>

  <footer>© <span id="y"></span> Suomen 585 Oy</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
