<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brunbar</title>
  <style>
    :root {
      --purple: #3a006b;
      --gold:   #d4af37;
      --gold-weak: rgba(212, 175, 55, 0.6);
    }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      background: var(--purple); color: var(--gold);
      display: grid; place-items: center; text-rendering: optimizeLegibility;
    }
    .top-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--gold);
      color: var(--purple);
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    .card {
      text-align: center; padding: clamp(2rem, 4vw, 4rem);
      border: 2px solid var(--gold-weak); border-radius: 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      position: relative;
    }
    /* muu css voi jäädä samaksi */
  </style>
</head>
<body>
  <!-- Nappi yläkulmaan -->
  <a href="suomen585.html" class="top-btn">Suomen 585 Oy</a>

  <main class="wrap">
    <section class="card" aria-label="Brunbar yhteystiedot">

      <div class="sep"></div>
      <div class="contact">

        Max Barman<br>
        <a href="tel:+358449721998">+358 44 972 1998</a><br>
        <a href="mailto:Max.Barman@brunbar.fi">Max.Barman@brunbar.fi</a>
      </div>
      <div class="contact">
        <h2>Taloushallinto-, kirjanpito ja konsultointipalvelut:</h2>
        Anna Sinkkonen<br>
        <a href="tel:+358404115802">+358 40 411 5802</a><br>
        <a href="mailto:Anna.Sinkkonen@brunbar.fi">Anna.Sinkkonen@brunbar.fi</a>
      </div>
    </section>
  </main>
</body>
</html>
